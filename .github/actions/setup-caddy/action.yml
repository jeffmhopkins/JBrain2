name: Set up Caddy
description: >
  Put a pinned, checksum-verified caddy binary on PATH for the backend tests that run the
  repo's real Caddyfile (tests/unit/test_owner_site.py).

# The proxy image is caddy:2, so this pins the version the tests saw rather than the one the
# box runs. That is the point of pinning: a test that passed on one binary keeps meaning the
# same thing. Bump CADDY_VERSION and CADDY_SHA256 together (sha256 of the release tarball).

runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/caddy-bin
        key: caddy-2.10.2-${{ runner.os }}-${{ runner.arch }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CADDY_VERSION: 2.10.2
        CADDY_SHA256: 5c218bc34c9197369263da7e9317a83acdbd80ef45d94dca5eff76e727c67cdd
      run: |
        set -euo pipefail
        mkdir -p ~/caddy-bin
        url="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
        curl -fsSL --retry 3 -o /tmp/caddy.tgz "$url"
        echo "${CADDY_SHA256}  /tmp/caddy.tgz" | sha256sum -c -
        tar -xzf /tmp/caddy.tgz -C ~/caddy-bin caddy

    - shell: bash
      run: echo "$HOME/caddy-bin" >> "$GITHUB_PATH"
