name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A superseded run is wasted minutes by definition: pushing twice to a PR used to leave
# the first run grinding to completion against a commit nobody will merge. Cancelled per
# ref, and only for pull_request -- a push to main or a tag must finish, because that is
# the run that publishes images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Work out which top-level areas a PR actually touches, so the heavy jobs (above
  # all backend's Postgres testcontainers suite) can no-op when they're irrelevant.
  # On push (main/tags) nothing is filtered — main always gets the full suite.
  # Every area filter also includes this workflow, so a CI edit re-runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 20s observed
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      supervisor: ${{ steps.f.outputs.supervisor }}
      jcode: ${{ steps.f.outputs.jcode }}
      jlaunch: ${{ steps.f.outputs.jlaunch }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      # paths-filter uses the compare API on pull_request events, but falls back to
      # local git on push (merge to main) — where it needs a checkout, or it exits
      # 128 ("not a git repository") and the job (cosmetically) fails on every merge.
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            supervisor:
              - 'supervisor/**'
              - '.github/workflows/ci.yml'
            jcode:
              - 'jcode/**'
              - '.github/workflows/ci.yml'
            jlaunch:
              - 'jlaunch/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # NOTE: the area jobs always run so their status checks always post — the heavy
  # steps are gated instead of the whole job, so this stays safe with branch
  # protection whatever the required-check names are (a gated job still reports
  # success in seconds). The gate is: this area changed on the PR, OR it's a push.
  # The backend suite is the long pole, so it is split across runners that work in
  # PARALLEL rather than one job doing everything in sequence:
  #
  #   backend-checks       ruff + format + pyright        (~1 min, no tests)
  #   backend-unit         pytest -m "not integration"    (~4.2k tests, sharded x3)
  #   backend-integration  pytest -m integration          (~1.1k tests, testcontainers)
  #   backend              combines their coverage and enforces the 80% gate
  #
  # Wall clock becomes the SLOWEST half rather than the sum of both, and a failure names
  # which half broke without opening the log. The `backend` job keeps its name because it
  # is the one branch protection may require — it now means "every backend job passed".
  #
  # Integration is deliberately NOT gated on narrower paths than the rest of the backend.
  # It is where the RLS firewall is proven (CLAUDE.md #3), and a path heuristic that
  # skipped it would let exactly the change that widens a query past its policy through
  # unproven.
  backend-checks:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ~1m observed
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.13"
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: uv sync --all-extras
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: uv run ruff check .
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: uv run ruff format --check .
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: uv run pyright

  backend-unit:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20  # ~2m30s observed, plus the ffmpeg install
    # Sharded across runners because this half is the long pole: ~4.2k tests, and xdist
    # only spreads them over ONE runner's cores. Round-robin by sorted filename — a
    # deterministic split needing no plugin and no committed durations file to go stale.
    # Balanced by file COUNT, not runtime, which is close enough on a suite this uniform.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    defaults:
      run:
        working-directory: backend
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: "3"
      # coverage.py's default C tracer roughly doubles the pytest wall-clock on this
      # suite (measured: +84%). PEP 669 sys.monitoring cuts that to ~+15% while
      # keeping the same line coverage. Requires the 3.13 pinned below (sysmon is 3.12+);
      # on an older interpreter coverage silently falls back to the C tracer.
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v5
      # ffmpeg/ffprobe back the analyze_video frame-sampling tests (jbrain.media),
      # which skip WHOLESALE without them -- see the action for why it is not a
      # plain `apt-get install`, and why it is one shared copy rather than two.
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        uses: ./.github/actions/setup-ffmpeg
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.13"
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: uv sync --all-extras
      # No Docker here: everything Docker-backed carries the `integration` marker and runs
      # in the job below, so this half never waits on a container to come up.
      #
      # `-m "not integration"` still applies on top of the shard's file list: it is what
      # keeps a stray Docker-backed test out of a runner that has no container, and it
      # costs nothing when the list is already unit files.
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: |
          files=($(ls tests/unit/test_*.py | sort))
          shard=()
          for i in "${!files[@]}"; do
            (( i % SHARDS == SHARD )) && shard+=("${files[$i]}")
          done
          echo "shard $SHARD/$SHARDS: ${#shard[@]} of ${#files[@]} files"
          uv run pytest "${shard[@]}" -m "not integration" -n auto --dist loadscope --cov
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: mv .coverage .coverage.unit-${{ matrix.shard }}
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.shard }}
          path: backend/.coverage.unit-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1

  backend-integration:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30  # ~6m observed, plus the ffmpeg install
    defaults:
      run:
        working-directory: backend
    env:
      # Ryuk reaps leaked containers; the runner is ephemeral, so it is dead
      # weight here and its Docker Hub image pull is a recurring flake. Skip it.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v5
      # Same ffmpeg install as backend-unit -- literally, now: one composite action,
      # so the two cannot drift.
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        uses: ./.github/actions/setup-ffmpeg
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.13"
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: uv sync --all-extras
      # Runners have Docker, so the testcontainers RLS suite runs here. One
      # Postgres container is provisioned per xdist worker (session-scoped, shared
      # via a filelock) and each test module clones a fresh DB from the migrated
      # template — so spread modules across cores with xdist; loadscope keeps a
      # module (and its DB) on one worker so the module-scoped fixtures stay valid.
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: uv run pytest -m integration -n auto --dist loadscope --cov
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: mv .coverage .coverage.integration
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: backend/.coverage.integration
          include-hidden-files: true
          retention-days: 1

  # The gate. Named `backend` so an existing required status check keeps working; it now
  # means "checks, unit and integration all passed, and their COMBINED coverage clears
  # 80%". Combining is the point — neither half covers the codebase alone, so gating each
  # separately would either fail honest code or force two meaningless thresholds.
  backend:
    needs: [changes, backend-checks, backend-unit, backend-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15  # coverage merge only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.13"
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: uv sync --all-extras
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: backend
      # `relative_files` (pyproject) is what lets these merge: the two halves recorded
      # different absolute checkout paths, and combine only merges files it can see as the
      # same file.
      # No arguments: combine globs every .coverage.* in the directory, so changing the
      # shard count above needs no edit here.
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: uv run coverage combine
      - if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: uv run coverage report --fail-under=80

  supervisor:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ~20s observed
    defaults:
      run:
        working-directory: supervisor
    steps:
      - uses: actions/checkout@v5
      - if: needs.changes.outputs.supervisor == 'true' || github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: supervisor/uv.lock
      - if: needs.changes.outputs.supervisor == 'true' || github.event_name != 'pull_request'
        run: uv sync --all-extras
      - if: needs.changes.outputs.supervisor == 'true' || github.event_name != 'pull_request'
        run: uv run ruff check .
      - if: needs.changes.outputs.supervisor == 'true' || github.event_name != 'pull_request'
        run: uv run ruff format --check .
      - if: needs.changes.outputs.supervisor == 'true' || github.event_name != 'pull_request'
        run: uv run pyright
      - if: needs.changes.outputs.supervisor == 'true' || github.event_name != 'pull_request'
        run: uv run pytest

  # The jcode control server (opt-in code mode) — a Python service tested like the
  # supervisor: its unit tests run against fakes (no SDK, no model, no network), so
  # CI needs no GPU/box. The box-only SDK + CLI live in jcode/Dockerfile.
  jcode:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ~30s observed
    defaults:
      run:
        working-directory: jcode
    steps:
      - uses: actions/checkout@v5
      - if: needs.changes.outputs.jcode == 'true' || github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: jcode/uv.lock
      - if: needs.changes.outputs.jcode == 'true' || github.event_name != 'pull_request'
        run: uv sync --all-extras
      - if: needs.changes.outputs.jcode == 'true' || github.event_name != 'pull_request'
        run: uv run ruff check .
      - if: needs.changes.outputs.jcode == 'true' || github.event_name != 'pull_request'
        run: uv run ruff format --check .
      - if: needs.changes.outputs.jcode == 'true' || github.event_name != 'pull_request'
        run: uv run pyright
      - if: needs.changes.outputs.jcode == 'true' || github.event_name != 'pull_request'
        run: uv run pytest

  # The jlaunch control server (job launcher for long one-shot computations) — same
  # shape as jcode: a Python service whose unit tests run against fakes and a trivial
  # test spec (no real repo clone, no 10 h census, no network). The real box-only work
  # lives in jlaunch/Dockerfile.
  jlaunch:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ~20s observed
    defaults:
      run:
        working-directory: jlaunch
    steps:
      - uses: actions/checkout@v5
      - if: needs.changes.outputs.jlaunch == 'true' || github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: jlaunch/uv.lock
      - if: needs.changes.outputs.jlaunch == 'true' || github.event_name != 'pull_request'
        run: uv sync --all-extras
      - if: needs.changes.outputs.jlaunch == 'true' || github.event_name != 'pull_request'
        run: uv run ruff check .
      - if: needs.changes.outputs.jlaunch == 'true' || github.event_name != 'pull_request'
        run: uv run ruff format --check .
      - if: needs.changes.outputs.jlaunch == 'true' || github.event_name != 'pull_request'
        run: uv run pyright
      - if: needs.changes.outputs.jlaunch == 'true' || github.event_name != 'pull_request'
        run: uv run pytest

  frontend:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15  # ~1m40s observed
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        run: npm ci
      - if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        run: npm run lint
      - if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        run: npm run typecheck
      - if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        run: npm run test
      - if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        run: npm run build

  # Documentation freshness — enforces docs/DOC_LIFECYCLE.md: no stale migration
  # counters in prose, no shipped plan still labelled active, every doc carries a
  # freshness header, every directory index names its folder. Pure bash/grep/awk
  # over docs/ — no deps to install, so it always runs (fast, and a code change can
  # still leave a doc stale). Errors fail; warnings don't.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # ~10s observed
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/docs-freshness.sh

  images:
    # stable channel = release tags; edge channel = every green main build.
    if: github.event_name == 'push'
    needs: [backend, supervisor, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20  # ~40s per image observed; docker build + push
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile
          - name: supervisor
            context: supervisor
            dockerfile: supervisor/Dockerfile
          - name: proxy
            context: .
            dockerfile: deploy/Dockerfile.proxy
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/jbrain2-${{ matrix.name }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
