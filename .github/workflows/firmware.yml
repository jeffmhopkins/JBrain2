# The endpoint firmware builds against a ~2 GB ESP-IDF toolchain and only depends on
# firmware/** (the twins' S3 panels) and firmware-c6/** (Jeff's C6 jpanel), so it runs on its own path filter rather than on every PR — the android.yml
# pattern. The workflow file is in the filter so changes to it still trigger a run.
#
# There is no hardware in CI, so what this proves is that the image COMPILES and that it fits
# the partition table. That is most of the value: the alternative is discovering a typo on a
# board that has to be found, unplugged and cabled to the box.
#
# It proves one more thing now: that the images COMMITTED to `firmware/dist/` are the ones
# this source builds. Those committed bytes are what the box flashes — it reads them off its
# own checkout instead of downloading a release — so nothing else would notice them going
# stale until a panel was in someone's hand. `CONFIG_APP_REPRODUCIBLE_BUILD=y` is what makes
# that check writable at all: without it ESP-IDF stamps the build date and absolute paths
# into the app descriptor and no two builds ever match.
name: firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "firmware/**"
      - "firmware-c6/**"
      - "docs/mocks/jpanel-s3/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "firmware-c6/**"
      - "docs/mocks/jpanel-s3/**"
      - ".github/workflows/firmware.yml"
  # GitHub starts no workflow runs for a pull request opened through an App, so a PR raised by
  # an assistant carries no checks at all — see the same note in ci.yml. A dispatch is the
  # supported way back, and without one this workflow could never gate such a PR. No path
  # filter applies to a dispatch, which is what makes it usable as that fallback.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # toolchain pull dominates; no baseline measured yet
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # The pure-C half, on the host, BEFORE the toolchain pull — it takes two seconds and it
      # is the only place this firmware has assertions at all. There is no hardware in CI, so
      # anything testable off-device should be: the rig's selection logic (weights, cooldowns,
      # the repetition penalty) and the renderer's invariants are exactly that. It also
      # enforces the standing claim that `face.c`, `font.c`, `emotion.c`, `rig.c` and
      # `variants.c` have no ESP dependencies — include `esp_log.h` in one of them and this
      # link fails here rather than on a panel in a bedroom.
      - name: Host tests for the pure-C modules
        run: make -C firmware/host test

      # THE BROWSER BENCH (`docs/mocks/jpanel-s3/`) is the panel's own UI code compiled to
      # WebAssembly, and the reason it exists is that what it shows is what the glass does. So
      # the committed module has to be what this source builds — a bench left on last month's
      # machine would approve behaviour the panel no longer has — and it has to survive a run
      # through a message, a reply and a send. Clang is pinned by name; the rest of the
      # toolchain is pinned by `build.sh`.
      - name: Browser bench is current and runs
        env:
          CLANG: clang-18
        run: |
          firmware/mock/build.sh "$RUNNER_TEMP/sim.wasm"
          node firmware/mock/smoke.mjs "$RUNNER_TEMP/sim.wasm"
          if ! cmp -s "$RUNNER_TEMP/sim.wasm" docs/mocks/jpanel-s3/sim.wasm; then
            echo "### docs/mocks/jpanel-s3/sim.wasm is not what this source builds" >> "$GITHUB_STEP_SUMMARY"
            echo 'Rebuild it: `firmware/mock/build.sh` (clang 18), then commit sim.wasm.' >> "$GITHUB_STEP_SUMMARY"
            echo "MISMATCH: docs/mocks/jpanel-s3/sim.wasm" >&2
            exit 1
          fi

      # Pinned to the version Waveshare's own examples for this board target, so the vendor
      # drivers we port from in later waves compile against the same headers.
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware

      # THE STATIC INTERNAL-RAM BUDGET (plan §6a, gate 1). Internal RAM is what Wi-Fi, the PHY
      # and a TLS handshake are made of, and 0.3.39 aborted at boot for want of it — so the
      # statics a release puts there (`.data` + `.bss` in DIRAM) are measured on every build and
      # may not creep. Baseline 0.3.39: .data 76,856 + .bss 20,288 = 97,144 B. 0.4.0 measured
      # .data 76,840 + .bss 16,696 = 93,536 B (its new statics went to PSRAM). The budget is the
      # baseline plus 1,024 B: a release may grow a little; more than that is a decision to make
      # out loud, by moving this line, not something a build drifts into.
      - name: Measure the image (idf.py size)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware
          command: idf.py size --format json2 --output-file build/size.json
      - name: Static DIRAM must stay inside its budget
        run: |
          python3 - <<'EOF'
          import json, sys
          BASELINE = 97144  # 0.3.39: .data 76,856 + .bss 20,288
          BUDGET = 1024
          layout = json.load(open("firmware/build/size.json"))["layout"]
          diram = next(m for m in layout if m["name"] == "DIRAM")
          parts = {k: v["size"] for k, v in diram["parts"].items()}
          static = parts.get(".data", 0) + parts.get(".bss", 0)
          print(f"DIRAM used {diram['used']} of {diram['total']} B: "
                + ", ".join(f"{k} {v}" for k, v in parts.items()))
          print(f"static DIRAM (.data + .bss) {static} B; baseline {BASELINE} B; "
                f"limit {BASELINE + BUDGET} B ({static - BASELINE:+d} B against 0.3.39)")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(f"static DIRAM {static} B (limit {BASELINE + BUDGET} B)\n")
          if static > BASELINE + BUDGET:
              sys.exit(f"static DIRAM {static} B exceeds {BASELINE} + {BUDGET} B: move new "
                       "statics to PSRAM (EXT_RAM_BSS_ATTR) or raise the budget deliberately")
          EOF

      # THE COMMITTED IMAGES ARE THE PRODUCT. The box flashes `firmware/dist/` straight
      # out of the checkout `update-inner.sh` keeps current, so a stale `dist/` is a panel
      # running the wrong firmware with nothing to say so. This is the only thing that
      # notices — and it is exact, not a version-string comparison: the same source must
      # produce the same bytes.
      - name: The committed images must match this source
        run: |
          set -eu
          mkdir -p out
          cp firmware/build/jbrain-endpoint.bin out/
          cp firmware/build/bootloader/bootloader.bin out/
          cp firmware/build/partition_table/partition-table.bin out/
          cp firmware/build/ota_data_initial.bin out/
          cp firmware/build/srmodels/srmodels.bin out/
          ( cd out && sha256sum ./*.bin | sed 's| \./| |' > SHA256SUMS )
          echo "version=$(cat firmware/version.txt)" >> "$GITHUB_STEP_SUMMARY"
          for f in bootloader.bin partition-table.bin ota_data_initial.bin jbrain-endpoint.bin; do
            if ! cmp -s "out/$f" "firmware/dist/$f"; then
              {
                echo "### firmware/dist/$f is not what this source builds"
                echo
                echo 'Rebuild and commit it:'
                echo '```'
                echo 'scripts/firmware-setup.sh      # once, installs ESP-IDF v5.5.5'
                echo '. ~/esp-idf/export.sh && (cd firmware && idf.py build)'
                echo 'scripts/firmware-dist.sh       # copies the built set into dist/'
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "MISMATCH: firmware/dist/$f" >&2
              exit 1
            fi
          done
          # THE MODELS ARE CHECKED BY CONTENT, NOT BY BYTES, AND THAT IS NOT A WEAKER CHECK.
          # esp-sr's packer (`model/pack_model.py`) collects models with `os.walk` and never
          # sorts, so the order they land in is filesystem-dependent: two correct builds of
          # the identical models differ in nearly every byte while being exactly the same
          # size. `CONFIG_APP_REPRODUCIBLE_BUILD` cannot help — it is not our build. So the
          # comparison is every model, every file in it, and the SHA-256 of each file's
          # bytes: byte-for-byte equality modulo an ordering nobody chose. It still catches
          # a wrong wake word, a missing model, a truncated file or a stale commit.
          if ! diff -u <(python3 scripts/srmodels-inventory.py firmware/dist/srmodels.bin) \
                       <(python3 scripts/srmodels-inventory.py out/srmodels.bin); then
            {
              echo "### firmware/dist/srmodels.bin does not hold the models this source selects"
              echo
              echo 'Rebuild and commit it:'
              echo '```'
              echo '. ~/esp-idf/export.sh && (cd firmware && idf.py build)'
              echo 'scripts/firmware-dist.sh'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "MISMATCH: firmware/dist/srmodels.bin (contents)" >&2
            exit 1
          fi
          # The checksum file the api verifies against at flash time, so it cannot drift
          # away from the images sitting beside it either. `srmodels.bin` is excluded from
          # the diff for the ordering reason above and checked against the COMMITTED blob
          # instead — which is exactly what the api verifies at flash time, so the guarantee
          # the sum file actually provides (this file is not truncated or corrupt) is intact.
          grep -v ' srmodels.bin$' firmware/dist/SHA256SUMS > dist.sums
          grep -v ' srmodels.bin$' out/SHA256SUMS > out.sums
          diff -u dist.sums out.sums
          ( cd firmware/dist && grep ' srmodels.bin$' SHA256SUMS | sha256sum -c - )
          echo "firmware/dist/ matches this build" >> "$GITHUB_STEP_SUMMARY"

      # Kept so a mismatch can be inspected rather than only asserted.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-firmware
          path: out/
          if-no-files-found: ignore

  # JEFF'S C6 JPANEL — a separate project with its own committed images, held to the same
  # rule: `firmware-c6/dist/` is what the box flashes, so it must be what this source builds.
  # No srmodels.bin (ESP-SR does not support the C6, so there is no model partition).
  firmware-c6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # The app framework's pure half — shell arbitration, the app models, the notice policy,
      # the debug surface's redaction, the drivers' decisions (flush alignment, the PMIC's
      # registers, button debounce, the boot-after-a-fault guard) — in seconds, before the
      # toolchain pull.
      - name: Host tests for the app framework
        run: make -C firmware-c6/host test

      # Every app depends only on app_api, ui_kit and LVGL (JPANEL_C6_PLAN.md §1). The
      # self-test first, so a checker that has stopped catching anything fails too.
      - name: Apps never depend on each other
        run: |
          python3 firmware-c6/tools/check_app_deps.py --self-test
          python3 firmware-c6/tools/check_app_deps.py

      # The framework against real LVGL, headless: every mock board's state rendered through
      # the debug screenshot path, every app opened and closed back to the same widget and
      # timer count, and a debug snapshot checked for provisioning secrets. The PNGs are
      # uploaded so a drift from docs/mocks/jpanel-c6/ is visible in review.
      - name: Simulator renders the mock states
        run: firmware-c6/sim/render.sh "$RUNNER_TEMP/jpanel-c6-sim" "$RUNNER_TEMP/sim-build"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpanel-c6-sim
          path: ${{ runner.temp }}/jpanel-c6-sim/
          if-no-files-found: ignore

      # The same IDF pin as the S3 job, so the two projects never disagree about a header.
      # Since 0.0.4 the image carries LVGL and the CO5300's sh8601 driver as managed
      # components: the build fetches them itself, at the versions and content hashes
      # `firmware-c6/dependencies.lock` pins, so the byte comparison below still holds.
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32c6
          path: firmware-c6

      - name: The committed images must match this source
        run: |
          set -eu
          mkdir -p out
          cp firmware-c6/build/jbrain-jpanel-c6.bin out/
          cp firmware-c6/build/bootloader/bootloader.bin out/
          cp firmware-c6/build/partition_table/partition-table.bin out/
          cp firmware-c6/build/ota_data_initial.bin out/
          ( cd out && sha256sum ./*.bin | sed 's| \./| |' > SHA256SUMS )
          echo "version=$(cat firmware-c6/version.txt)" >> "$GITHUB_STEP_SUMMARY"
          for f in bootloader.bin partition-table.bin ota_data_initial.bin jbrain-jpanel-c6.bin; do
            if ! cmp -s "out/$f" "firmware-c6/dist/$f"; then
              {
                echo "### firmware-c6/dist/$f is not what this source builds"
                echo
                echo 'Rebuild and commit it:'
                echo '```'
                echo 'IDF_TARGETS=esp32c6 scripts/firmware-setup.sh   # once'
                echo '. ~/esp-idf/export.sh && (cd firmware-c6 && idf.py fullclean && idf.py build)'
                echo 'scripts/firmware-dist.sh firmware-c6'
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "MISMATCH: firmware-c6/dist/$f" >&2
              exit 1
            fi
          done
          diff -u firmware-c6/dist/SHA256SUMS out/SHA256SUMS
          echo "firmware-c6/dist/ matches this build" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpanel-c6-firmware
          path: out/
          if-no-files-found: ignore
