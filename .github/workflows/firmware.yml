# The endpoint firmware builds against a ~2 GB ESP-IDF toolchain and only depends on
# firmware/**, so it runs on its own path filter rather than on every PR — the android.yml
# pattern. The workflow file is in the filter so changes to it still trigger a run.
#
# There is no hardware in CI, so what this proves is that the image COMPILES and that it fits
# the partition table. That is most of the value: the alternative is discovering a typo on a
# board that has to be found, unplugged and cabled to the box.
name: firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  # GitHub starts no workflow runs for a pull request opened through an App, so a PR raised by
  # an assistant carries no checks at all — see the same note in ci.yml. A dispatch is the
  # supported way back, and without one this workflow could never gate such a PR. No path
  # filter applies to a dispatch, which is what makes it usable as that fallback.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # toolchain pull dominates; no baseline measured yet
    permissions:
      # Only what publishing a release needs. The default token is read-only for
      # contents, so without this the release step 403s after a successful build.
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Pinned to the version Waveshare's own examples for this board target, so the vendor
      # drivers we port from in later waves compile against the same headers.
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware

      # The artifact IS the product: generic, credential-free, and the exact bytes the box
      # flashes over USB and later serves for OTA. Nothing here is unit-specific — the Wi-Fi
      # credentials, device token and box CA live in an NVS blob the box writes at flash time.
      - name: Collect the flashable set
        run: |
          set -eu
          mkdir -p out
          cp firmware/build/jbrain-endpoint.bin out/
          cp firmware/build/bootloader/bootloader.bin out/
          cp firmware/build/partition_table/partition-table.bin out/
          cp firmware/build/flash_args out/ 2>/dev/null || true
          # Checksums travel WITH the images, because the box verifies them after
          # downloading: these bytes become a bootloader on a device that, once it is in a
          # bedroom, has no cable attached to it. A truncated download that flashes is
          # worse than one that fails.
          ( cd out && sha256sum ./*.bin > SHA256SUMS )
          echo "version=$(cat firmware/version.txt)" >> "$GITHUB_STEP_SUMMARY"
          ls -l out/ >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-firmware
          path: out/
          if-no-files-found: error

      # A RELEASE, not just an artifact, and that difference is the whole point: artifact
      # downloads need a GitHub token even on a public repo, while release assets do not.
      # This repo is public, so the box fetches its own firmware over plain HTTPS with no
      # credential — which is what lets Ops -> Room endpoints offer "Update firmware"
      # instead of asking the owner to download a zip and upload it (CLAUDE.md #10).
      #
      # Tagged from firmware/version.txt and SKIPPED when that tag already exists, so
      # bumping that file is what cuts a release — the same file the running firmware
      # compares itself against, so a version can never be published under a tag the
      # image does not report.
      - name: Publish the firmware release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="firmware-v$(cat firmware/version.txt)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already published — bump firmware/version.txt to cut a new one." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$tag" out/* \
            --title "Room endpoint firmware $(cat firmware/version.txt)" \
            --notes "Flashable set for the Waveshare ESP32-S3-Touch-AMOLED-1.8. Fetched by the box at Ops -> Room endpoints; see docs/plans/ROOM_ENDPOINT_PLAN.md."
          echo "published $tag" >> "$GITHUB_STEP_SUMMARY"
