# The first-start config for the house's DNS (docs/runbooks/HOME_DNS.md). Copied onto
# the volume ONLY when no config is there yet: after that AdGuard Home owns the file and
# rewrites it, and entrypoint.sh re-pins just the address, UI and user (pin.awk). Keys
# left out take AdGuard's defaults. Having a file at all skips AdGuard's first-run
# wizard, which would otherwise offer the whole LAN an unauthenticated setup page.
http:
  # Placeholder; pin.awk sets the docker bridge gateway.
  address: 127.0.0.1:3053
  session_ttl: 720h
users: []
dns:
  # Placeholder; pin.awk sets the box's LAN address.
  bind_hosts:
    - 127.0.0.1
  port: 53
  # Encrypted upstreams, so the ISP sees neither the lookups nor which ones were blocked.
  # Two operators, asked in parallel: one being down never takes the house offline.
  upstream_dns:
    - https://dns.quad9.net/dns-query
    - https://cloudflare-dns.com/dns-query
  upstream_mode: parallel
  bootstrap_dns:
    - 9.9.9.9
    - 1.1.1.1
  fallback_dns:
    - 9.9.9.9
  cache_enabled: true
  # Names devices in the log by asking the router who each LAN address is.
  use_private_ptr_resolvers: true
filtering:
  protection_enabled: true
  filtering_enabled: true
filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  # Device telemetry by vendor (Samsung, LG, Roku, Amazon, Apple, Xiaomi, ...): the
  # list aimed squarely at what smart TVs phone home with.
  - enabled: true
    url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/native.txt
    name: HaGeZi Native Tracker
    id: 2
  - enabled: true
    url: https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV-AGH.txt
    name: Perflyst Smart TV
    id: 3
user_rules: []
# A week: long enough to see a TV's habits, short enough that the house's browsing
# history does not pile up on the box.
querylog:
  enabled: true
  file_enabled: true
  interval: 168h
  size_memory: 1000
statistics:
  enabled: true
  interval: 168h
schema_version: 34
