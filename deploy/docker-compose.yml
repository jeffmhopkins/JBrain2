# Production stack, built from the local source tree (/opt/jbrain2/src) —
# no registry pulls except public base images. The project name fixes compose
# labels to com.docker.compose.project=jbrain, which is how the supervisor
# scopes its view of the Docker daemon.
name: jbrain

services:
  proxy:
    image: jbrain2-proxy:local
    build:
      context: ./src
      dockerfile: deploy/Dockerfile.proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Direct mode: the bare domain (Caddy fetches Let's Encrypt). Tunnel mode:
      # http://<domain> (plain HTTP behind Cloudflare). Defaults to JBRAIN_DOMAIN
      # so installs that predate tunnel support keep their auto-TLS behaviour.
      JBRAIN_SITE_ADDR: ${JBRAIN_SITE_ADDR:-${JBRAIN_DOMAIN}}
      # Local-network access, ON by default: serves the app over HTTPS for
      # jbrain.local (Caddy's internal CA) so owner login works on the LAN even
      # when the tunnel/internet is down (the Secure cookie needs HTTPS). The
      # host advertises the name over mDNS via an avahi CNAME alias — see
      # deploy/lan-setup.sh. Blank JBRAIN_LAN_ADDR in .env to turn it off.
      # See docs/runbooks/LOCAL_ACCESS.md. Bare `-` (not `:-`): an explicitly
      # empty value in .env passes through as empty (so blanking actually
      # disables it); only an absent/unset var falls back to the default.
      JBRAIN_LAN_ADDR: ${JBRAIN_LAN_ADDR-https://jbrain.local}
      # Host-mode jcode web preview (docs/archive/JCODE_PREVIEW_HOST_PLAN.md): when set, the
      # entrypoint renders a wildcard *.<host> Caddy site that routes <slug>-preview.<host>
      # to the api's /__jcode_preview/<slug>. Shares the .env var with the api + jcode
      # services; empty (the default) leaves the preview site unrendered.
      JBRAIN_JCODE_PREVIEW_BASE_HOST: ${JCODE_PREVIEW_BASE_HOST:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [api]

  # OPT-IN Cloudflare Tunnel: a dial-OUT connector that publishes the stack on
  # your own domain with NO static IP, NO port-forwarding, and NO inbound
  # reachability — it works behind CGNAT. Guarded by the `tunnel` profile so a
  # stock deploy never starts it; install.sh flips TUNNEL_ENABLED on (and the
  # `jbrain` helper adds --profile tunnel to match) when you choose tunnel mode.
  # In tunnel mode Caddy serves plain HTTP (see JBRAIN_SITE_ADDR) and the
  # connector reaches it at http://proxy:80 over the `edge` network; configure
  # that origin and the public hostname in the Cloudflare dashboard. The token
  # carries the tunnel's identity and routing — see docs/runbooks/CLOUDFLARE_TUNNEL.md.
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    networks: [edge]
    depends_on: [proxy]

  api:
    image: jbrain2-api:local
    build:
      context: ./src/backend
      # Build provenance stamped into the image so the debug /version route can
      # report the deployed revision. update-inner.sh exports these from the freshly
      # reset `src` worktree; a plain `docker compose build` leaves them "unknown".
      args:
        JBRAIN_GIT_SHA: ${JBRAIN_GIT_SHA:-unknown}
        JBRAIN_GIT_DESCRIBE: ${JBRAIN_GIT_DESCRIBE:-unknown}
        JBRAIN_BUILD_TIME: ${JBRAIN_BUILD_TIME:-unknown}
    restart: unless-stopped
    environment: &api_env
      JBRAIN_DATABASE_URL: postgresql+asyncpg://jbrain_app:${APP_DB_PASSWORD}@db:5432/jbrain
      JBRAIN_SUPERVISOR_URL: http://supervisor:9000
      JBRAIN_SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN}
      JBRAIN_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JBRAIN_XAI_API_KEY: ${XAI_API_KEY:-}
      JBRAIN_BLOB_DIR: /data/blobs
      JBRAIN_BACKUPS_DIR: /data/backups
      JBRAIN_EMBED_URL: http://embed:80
      # Neural wall display (deploy/wall): jerv POSTs a web-tool event here so the display
      # draws a reach-out tendril. On-box (internal network), best-effort, no owner data;
      # empty disables it. Worker inherits via *api_env.
      JBRAIN_BRAIN_EVENTS_URL: ${BRAIN_EVENTS_URL:-http://wall:8800/event}
      # The tts-stt speech service's piper TTS endpoint — the PWA read-aloud proxy
      # (/api/brain/tts, /api/brain/voices) and the tts_debug flag push target it.
      JBRAIN_BRAIN_TTS_URL: ${BRAIN_TTS_URL:-http://tts-stt:8801}
      # Self-hosted local models — OFF unless the operator opted in at install.
      # When enabled, points at the local-llm gateway (below) and lists the
      # provisioned catalog ids the settings screen may route to.
      JBRAIN_LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-false}
      JBRAIN_LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://local-llm:8080/v1}
      JBRAIN_LOCAL_MODELS: ${LOCAL_MODELS:-[]}
      # Headroom the residency budget keeps free (0.15 = 15%). The app is the box's sole
      # model evictor — before each local load it frees the fewest resident models needed
      # to keep this fraction of RAM free (jbrain.llm.residency), so any model loads by
      # unloading others until it fits. Replaced the old all-or-nothing pin that hard-froze
      # the box by co-residing ~91 GB with no headroom. 0.15 is low enough to co-reside the
      # recommended gpt-oss-120b + Qwen3-VL set on a 128 GB box, high enough to hold a real
      # margin against the kernel-reclaim freeze; raise it for more safety (more eviction),
      # lower it for more co-residence room at a thinner margin.
      JBRAIN_LOCAL_LLM_FREE_RAM_FRACTION: ${LOCAL_LLM_FREE_RAM_FRACTION:-0.15}
      # On-box image generation — OFF unless the operator opted in at install. When
      # enabled, points at the `comfyui` gateway (below) and lists the provisioned
      # catalog ids the settings screen may offer. Empty URL = feature off.
      JBRAIN_COMFYUI_URL: ${COMFYUI_URL:-}
      JBRAIN_COMFYUI_ENABLED: ${COMFYUI_ENABLED:-false}
      JBRAIN_COMFYUI_MODELS: ${COMFYUI_MODELS:-[]}
      # Bot-challenge solver web_fetch escalates to when the reader can't clear a wall (the
      # stock `byparr` service below). DEFAULT-ON: empty here falls back to the on-box default
      # (env_ignore_empty), so the tier is active out of the box; set SOLVER_URL to override, or
      # point it at a non-serving endpoint to disable. Worker inherits via *api_env.
      JBRAIN_SOLVER_URL: ${SOLVER_URL:-}
      # Domains routed STRAIGHT to the solver, skipping the direct+reader legs that only fail on
      # a hard bot-wall (Reuters/WSJ/Bloomberg 401 the fetch and 429 the reader). JSON array;
      # empty falls back to the built-in default list (env_ignore_empty). A solver miss still
      # falls back to the normal path, so a byparr outage degrades rather than hard-fails.
      JBRAIN_SOLVER_FIRST_DOMAINS: ${SOLVER_FIRST_DOMAINS:-}
      # On-box speech-to-text — served by the always-on `tts-stt` service (below), but the
      # STT MODEL is a heavy opt-in download, so transcribe stays OFF (empty URL) until
      # `jbrain enable-whisper` provisions the model and sets WHISPER_URL in .env
      # (http://tts-stt:8080/v1). Empty here = audio attachments aren't transcribed and
      # jerv's transcribe tool is hidden — never advertising an STT port that isn't loaded.
      # Read-aloud (piper TTS) needs none of this; it works from the default tts-stt service.
      JBRAIN_WHISPER_URL: ${WHISPER_URL:-}
      JBRAIN_WHISPER_ENABLED: ${WHISPER_ENABLED:-false}
      JBRAIN_WHISPER_MODEL: ${WHISPER_MODEL:-whisper}
      # Code mode (docs/archive/JCODE_PLAN.md) — OFF unless the operator opts in via
      # scripts/jcode-setup.sh. When enabled, points the api at the internal jcode
      # control server (Wave J2 proxies it to the owner); the shared token authenticates
      # those calls. Empty URL = feature off (fail-closed): no jcode routes, no tile.
      JBRAIN_JCODE_URL: ${JCODE_URL:-}
      JBRAIN_JCODE_ENABLED: ${JCODE_ENABLED:-false}
      JBRAIN_JCODE_TOKEN: ${JCODE_TOKEN:-}
      JBRAIN_JCODE_MODEL: ${JCODE_MODEL:-qwen3-coder-next}
      # The job launcher (docs/plans/JLAUNCH_PLAN.md): the api proxies its control server and
      # streams its artifact into the blob store at share time. ON BY DEFAULT (single-user
      # box) — the URL defaults to the in-network control server so the /jlaunch routes and
      # the Math tile are live out of the box; install/update provision JLAUNCH_TOKEN. Set
      # JLAUNCH_URL empty in .env to fail it closed. Shared token authenticates the api's
      # control calls (and the terminal WS bridge).
      JBRAIN_JLAUNCH_URL: ${JLAUNCH_URL:-http://jlaunch:9101}
      JBRAIN_JLAUNCH_ENABLED: ${JLAUNCH_ENABLED:-true}
      JBRAIN_JLAUNCH_TOKEN: ${JLAUNCH_TOKEN:-}
      # Host-mode web preview (docs/archive/JCODE_PREVIEW_HOST_PLAN.md): the zone previews hang
      # under. The api's preview proxy enforces the request Host is <slug>-preview.<this>
      # before forwarding, so a sandbox dev app can't be served on the owner origin.
      # Shares the .env var with the jcode service; empty fail-closes the proxy.
      JBRAIN_JCODE_PREVIEW_BASE_HOST: ${JCODE_PREVIEW_BASE_HOST:-}
      # The external-LLM proxy (owner-minted public endpoints exposing the on-box coder)
      # forwards straight to the local-llm gateway's OpenAI endpoint (JBRAIN_LOCAL_LLM_URL
      # above) — the api already reaches it on the `jcode` network. Off the jcode profile
      # the coder isn't resident, so the proxy fail-closes (no external sessions connect).
      JBRAIN_JCODE_GATEWAY_TOKEN: ${JCODE_GATEWAY_TOKEN:-}
      # Shared secret for the MQTT ingest service identity (JBrain360 M1): the API
      # validates it in /internal/mqtt-auth and the consumer connects with it. Empty
      # disables the identity (fail-closed). Only meaningful with the `mqtt` profile.
      JBRAIN_MQTT_INGEST_SECRET: ${MQTT_INGEST_SECRET:-}
      # Owner debug console (docs/runbooks/DEBUG_ACCESS.md) — OFF unless the operator opts
      # in. When false the /api/debug/* surface is not mounted and minting is
      # refused, so it adds zero attack surface. Turn it on only on a box you are
      # comfortable letting an external assistant read in full (incl. health/
      # finance/location). Tokens are still revocable + time-boxed.
      JBRAIN_DEBUG_ACCESS_ENABLED: ${DEBUG_ACCESS_ENABLED:-false}
      # Public, internet-reachable base URL (e.g. https://your-tunnel-host) embedded
      # in a minted debug-token payload, so a token handed to an external assistant
      # points at the public host even when minted from the LAN PWA. The LAN-only
      # console ignores it (it calls same-origin). Set it to your full https URL;
      # empty falls back to the PWA origin the token was minted from.
      JBRAIN_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - blobs:/data/blobs
      # Server-side basemap tile cache (location map proxy) — public map data, so
      # a plain named volume, kept out of backups.
      - tiles:/data/tiles
      # Export downloads stream from here; import uploads land here for the
      # supervisor's one-shot to pick up. Host path, shared with backup.sh.
      - ./backups:/data/backups
      # The provisioned local-model weights (same host dir the local-llm gateway
      # serves) so the settings drawer can report each model's real on-disk
      # footprint. WRITABLE: a context-window edit re-stamps llama-swap.yaml here
      # (atomically), which the gateway hot-reloads via --watch-config. Empty/absent
      # on a stock deploy — the read fails closed to the catalog estimate.
      - ./local-models:/data/local-models
      # Read-only view of the provisioned image weights so the settings drawer can
      # report each image model's real on-disk footprint (the shared RAM meter).
      - ./comfyui-models:/data/comfyui-models:ro
    # `jcode`: the api proxies the owner's code-mode control surface to the jcode
    # control server (http://jcode:9100), which lives ONLY on the jcode network — so
    # the api must join it or every /api/jcode/* call 502s (Wave J2). On a stock deploy
    # the network is empty (no jcode profile); the api's jcode client stays fail-closed.
    networks: [edge, internal, jcode, jlaunch]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Slim image has no curl; stdlib does the job.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # One-shot migration runner (docker compose run --rm migrate): migrations
  # need DDL rights, so only this short-lived container sees the superuser
  # URL — the api/worker stay on the RLS-bound app role.
  migrate:
    image: jbrain2-api:local
    profiles: [tools]
    command: ["alembic", "upgrade", "head"]
    environment:
      JBRAIN_MIGRATION_DATABASE_URL: postgresql+asyncpg://jbrain:${POSTGRES_PASSWORD}@db:5432/jbrain
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy

  # One-time DESTRUCTIVE install reset (docker compose run --rm wipe), run ONCE
  # on a fresh install before bringing the stack up: drops + rebuilds the schema,
  # clears blob/backup storage, and enables the v3 pipeline. Guarded by
  # JBRAIN_WIPE_ON_FIRST_DEPLOY (off here by default) AND a sentinel on the blob
  # volume, so it can never run twice or fire by accident. Needs the superuser
  # URL like migrate; mounts the same storage volumes it clears.
  wipe:
    image: jbrain2-api:local
    profiles: [tools]
    command: ["python", "-m", "jbrain.install_wipe"]
    environment:
      JBRAIN_MIGRATION_DATABASE_URL: postgresql+asyncpg://jbrain:${POSTGRES_PASSWORD}@db:5432/jbrain
      JBRAIN_WIPE_ON_FIRST_DEPLOY: ${WIPE_ON_FIRST_DEPLOY:-}
      JBRAIN_BLOB_DIR: /data/blobs
      JBRAIN_BACKUPS_DIR: /data/backups
    volumes:
      - blobs:/data/blobs
      - ./backups:/data/backups
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: jbrain2-api:local
    restart: unless-stopped
    command: ["python", "-m", "jbrain.worker"]
    environment: *api_env
    volumes:
      - blobs:/data/blobs
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy

  db:
    # TimescaleDB + PostGIS in one image; pgvector arrives with Phase 2.
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: jbrain
      POSTGRES_USER: jbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - db_data:/home/postgres/pgdata/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jbrain -d jbrain"]
      interval: 10s
      timeout: 5s
      retries: 10

  supervisor:
    image: jbrain2-supervisor:local
    build:
      context: ./src/supervisor
    restart: unless-stopped
    environment:
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN}
      COMPOSE_PROJECT: jbrain
      SELF_SERVICE: supervisor
      PROJECT_DIR: /opt/jbrain2
      # /proc/net/dev is network-namespace-scoped and, via the /proc/net -> self/net
      # symlink, always resolves to the READER's netns — so the container sees only
      # its own veth, never the box's Wi-Fi/ethernet uplink. Bind-mounting that file
      # doesn't help (it follows self into the container's netns). Instead read the
      # host's PID 1: files under /proc/<pid>/net/ reflect that TARGET pid's netns,
      # and host init is in the root netns, so /host/proc/1/net/dev spans every host
      # interface regardless of this container's netns.
      HOST_NET_DEV: /host/proc/1/net/dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Host /proc (read-only) so HOST_NET_DEV can reach host PID 1's net counters.
      - /proc:/host/proc:ro
    networks: [internal]

  # Neural wall display for the host's own (otherwise-blank) monitor or a LAN
  # wall kiosk — see deploy/wall. UNAUTHENTICATED by design: it serves ONLY host vitals
  # (GPU busy %, RAM, APU power, load) read from the /proc and /sys that Docker exposes
  # read-only to every container — the same sources as the supervisor's host metrics. It
  # touches no database and nothing behind the RLS firewalls, and it is published on its own
  # LAN port rather than behind Caddy, so it never shares the authed app's origin or session
  # cookie. Reachable at http://<host>.local:8800/. Keep it on the LAN — do not forward 8800
  # past the network edge; set BRAIN_HOST_BIND=127.0.0.1 to pin it to the box's own monitor.
  # Stdlib-only image (no piper — TTS moved to tts-stt); the app is bind-mounted, so serve.py
  # reads index.html from the mount each request and a `jbrain update` (git reset of src)
  # serves the new page with no rebuild. Read-aloud audio is FORWARDED to the tts-stt service
  # (BRAIN_TTS_URL) so the kiosk browser fetches it same-origin. Default profile -> up -d.
  wall:
    build:
      context: ./src
      dockerfile: deploy/Dockerfile.wall
    restart: unless-stopped
    command: ["python3", "/app/serve.py"]
    environment:
      BRAIN_PORT: "8800"
      BRAIN_POWER_MAX_W: ${BRAIN_POWER_MAX_W:-90}
      BRAIN_TTS_URL: ${BRAIN_TTS_URL:-http://tts-stt:8801}
      # See supervisor: /proc/net/dev follows self into this container's netns, so
      # read host PID 1's net counters (root netns) for the box's real uplink.
      HOST_NET_DEV: /host/proc/1/net/dev
    volumes:
      - ./src/deploy/wall:/app:ro
      - /proc:/host/proc:ro
    ports:
      - "${BRAIN_HOST_BIND:-0.0.0.0}:8800:8800"
    networks: [internal]

  # OPT-IN local model gateway: llama-swap fronting llama.cpp (Vulkan) so several
  # GGUF models share one OpenAI-compatible endpoint, loaded/swapped on demand.
  # Guarded by the `local-llm` compose profile so it NEVER starts on a stock
  # deploy — `jbrain enable-local-models` (scripts/local-llm-setup.sh) provisions
  # weights + config and flips the profile on. Vulkan needs only /dev/dri (not
  # /dev/kfd); weights and the generated config bind-mount from the host.
  local-llm:
    profiles: [local-llm]
    image: jbrain2-local-llm:local
    build:
      context: ./src
      dockerfile: deploy/Dockerfile.local-llm
      args:
        # Selectable gfx1151 base (default Vulkan/RADV), now PINNED by digest instead of the
        # floating `:vulkan-radv` tag: the tag tracked llama.cpp master, so `llama-server`
        # silently rode a moving build and a gpt-oss tool-call grammar regression crept in
        # (tool-carrying turns crash the upstream). Pinning makes the build reproducible and
        # stops future silent regressions. Bump this digest deliberately to move llama.cpp,
        # and re-verify tool calling on gpt-oss after. rocm users pin their own variant's
        # digest via LOCAL_LLM_BASE in .env.
        LOCAL_LLM_BASE: ${LOCAL_LLM_BASE:-docker.io/kyuz0/amd-strix-halo-toolboxes@sha256:e5acc83b946810971e09a0db4ee577af628b46c3f64592f8c2cfcfa65d6d0e48}
    restart: unless-stopped
    # Read the config from the /models mount — no separate single-file bind mount
    # (a missing file would make Docker create a directory and wedge the gateway).
    # --watch-config hot-reloads the file when the API re-stamps it after a
    # context-window edit (the new -c applies on the model's next load).
    command:
      ["llama-swap", "--listen", ":8080", "--config", "/models/llama-swap.yaml", "--watch-config"]
    devices:
      - /dev/dri:/dev/dri
    # seccomp=unconfined is what the kyuz0 toolbox guide runs for the Vulkan path
    # too (not only ROCm) — it lists it as required for gfx1151 stability. The
    # ROCm base additionally needs `- /dev/kfd:/dev/kfd` here.
    security_opt:
      - seccomp=unconfined
    # The container must join the HOST's video/render group GIDs to open
    # /dev/dri/renderD128 — group *names* rarely line up across host/container.
    # The setup script writes the numeric host GIDs; names are the fallback.
    group_add:
      - "${VIDEO_GID:-video}"
      - "${RENDER_GID:-render}"
    volumes:
      - ./local-models:/models:ro
    # Also joins the `jcode` network so the coding sandbox can reach the model
    # endpoint here — and ONLY this — without being on the shared `internal` net.
    networks: [internal, jcode]

  # OPT-IN on-box image generation: a ROCm ComfyUI serving Qwen-Image, the sibling
  # of the local-llm gateway. Guarded by the `comfyui` compose profile so it NEVER
  # starts on a stock deploy — `scripts/comfyui-setup.sh` provisions the weights and
  # flips the profile on. Validated on a Strix Halo (gfx1151) box: unlike the
  # Vulkan local-llm path, ComfyUI's ROCm stack needs BOTH /dev/kfd and /dev/dri,
  # and HSA_OVERRIDE_GFX_VERSION so ROCm treats the iGPU as gfx1151 (without it the
  # stack CPU-falls-back). The api reaches it at http://comfyui:8188 (internal
  # only, no host port). Weights bind-mount read-only from the host.
  comfyui:
    profiles: [comfyui]
    image: ${COMFYUI_IMAGE:-docker.io/kyuz0/amd-strix-halo-comfyui:latest}
    restart: unless-stopped
    # --preview-method auto emits b_preview frames over /ws during sampling, which
    # the live-generation pipeline relays to the chat as a progressive preview
    # (docs/archive/IMAGE_GEN_LIVE_PLAN.md). Cheap/low-fidelity; taesd is sharper but loads
    # a small decoder.
    command:
      ["python", "/opt/ComfyUI/main.py", "--listen", "0.0.0.0", "--port", "8188",
       "--preview-method", "auto"]
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp=unconfined
    environment:
      HSA_OVERRIDE_GFX_VERSION: "11.5.1"
    # Join the HOST's video/render GIDs to open /dev/dri/renderD128 — the setup
    # script writes the numeric host GIDs (shared with the local-llm gateway).
    group_add:
      - "${VIDEO_GID:-video}"
      - "${RENDER_GID:-render}"
    volumes:
      - ./comfyui-models:/opt/ComfyUI/models:ro
    networks: [internal]

  # tts-stt — the box's speech I/O in one always-on container: whisper.cpp speech-to-text
  # (llama-swap on :8080, the api reaches it at http://tts-stt:8080) AND warm Kokoro
  # text-to-speech (tts_server.py on :8801, reached by the api's read-aloud proxy and the
  # wall's /tts forward). DEFAULT-ON (no profile) — read-aloud must not depend on enabling
  # STT. Built on the official llama-swap unified image (llama-swap + ffmpeg, Vulkan) with
  # whisper.cpp's server + Python/Kokoro + the baked Kokoro weights layered on
  # (deploy/Dockerfile.tts-stt). /dev/dri + the GIDs give whisper the iGPU; Kokoro is CPU.
  # The CONTAINER is default-on (TTS always available); STT's GGML model is a heavy opt-in
  # download provisioned by `jbrain enable-whisper` (scripts/whisper-setup.sh), which also
  # sets WHISPER_URL so the api starts using it. Until then the entrypoint runs TTS only
  # (no whisper config -> no llama-swap), so a stock box serves read-aloud, not a dead STT
  # port. Internal only — neither port is published.
  tts-stt:
    image: jbrain2-tts-stt:local
    build:
      context: ./src
      dockerfile: deploy/Dockerfile.tts-stt
      args:
        # The base providing llama-swap + ffmpeg; whisper.cpp + Kokoro are layered on top.
        WHISPER_BASE: ${WHISPER_IMAGE:-ghcr.io/mostlygeek/llama-swap:vulkan}
    restart: unless-stopped
    environment:
      # Kokoro (TTS) — weights baked at /opt/kokoro; the warm server holds the model resident.
      BRAIN_TTS_PORT: "8801"
    # The launcher starts the Kokoro TTS server (background, :8801) then execs llama-swap
    # (foreground, :8080). Overrides the image's hardcoded `-config /app/config.yaml`
    # entrypoint (which would load a bundled sample and crash-loop). --watch-config on
    # llama-swap hot-reloads a model swap. Blank CMD so Docker can't re-append the default.
    entrypoint: ["/bin/sh", "/tts/entrypoint.sh"]
    command: []
    devices:
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp=unconfined
    # Join the HOST's video/render GIDs to open /dev/dri/renderD128 — the setup
    # script writes the numeric host GIDs (shared with the local-llm gateway).
    group_add:
      - "${VIDEO_GID:-video}"
      - "${RENDER_GID:-render}"
    volumes:
      - ./whisper-models:/models:ro
      - ./src/deploy/tts-stt:/tts:ro
    networks: [internal]

  # OPT-IN code mode (docs/archive/JCODE_PLAN.md): a sandboxed coding-session
  # service running xAI's Grok Build (`grok`) against an ON-BOX coder model, fronted
  # by the PWA. Guarded by the `jcode` compose profile so it NEVER starts on a stock
  # deploy — `scripts/jcode-setup.sh` provisions it and flips the profile on. It reads
  # NO knowledge base and holds NO owner data: its only state is per-session git
  # checkouts on the `jcode_work` volume. The model is local — `grok` reaches the
  # local-llm gateway over an OpenAI-compatible base_url (the api's residency-aware
  # jcode proxy), so no code leaves the box. It has NO published port and mounts NO
  # Docker socket.
  #
  # ISOLATION: the sandbox runs arbitrary agent-driven shell, so it sits on its OWN
  # `jcode` network — NOT the shared `internal` — and is therefore unable to reach
  # `db`, `supervisor` (which holds the docker socket), `worker`, `embed`, or the blob
  # store. The only peer on the `jcode` network is the `local-llm` gateway (the model
  # endpoint); the api joins it in Wave J2 to proxy the control surface.
  # HARDENING (Wave J5): resource caps (below) bound CPU/memory/PIDs; the control server
  # GC-reaps idle sessions. Outbound is still default NAT by DEFAULT; the HTTP(S)_PROXY
  # seam below makes a git/npm egress ALLOWLIST opt-in (an allowlisting forward proxy),
  # left opt-in because routing cloudflared over a proxy needs on-box verification.
  jcode:
    profiles: [jcode]
    image: jbrain2-jcode:local
    build:
      context: ./src/jcode
    restart: unless-stopped
    environment:
      # Bearer token the api presents on every control call (fail-closed: no token,
      # the service refuses to start). Shared with the api via JBRAIN_JCODE_TOKEN.
      JCODE_TOKEN: ${JCODE_TOKEN:-}
      JCODE_MODEL: ${JCODE_MODEL:-qwen3-coder-next}
      JCODE_MODEL_BASE_URL: ${JCODE_MODEL_URL:-http://local-llm:8080}
      # Grok Build (`grok`, xAI's official CLI) is the session harness. A login-shell hook
      # (/etc/profile.d/grok-config.sh) renders ~/.grok/config.toml from these vars so
      # `grok` targets the on-box models over an OpenAI-compatible base_url. base_url
      # points at the api's residency-aware jcode proxy (NOT the gateway directly): the
      # hook fetches every installed tool-capable model from its /models endpoint so
      # `grok`'s `/model` switches between them live, and every completion flows through it
      # so a plan↔execute switch evicts-to-budget (cold swap) instead of stacking two large
      # models and freezing the box. GROK_API_KEY is the shared jcode token the proxy
      # checks (sent as Authorization: Bearer). GROK_MODEL is the session's DEFAULT model;
      # the interactive terminal pins it per session with the owner's selection.
      GROK_MODELS_BASE_URL: ${JCODE_GROK_MODELS_URL:-http://api:8000/api/jcode/llm/v1}
      GROK_API_KEY: ${JCODE_GATEWAY_TOKEN:-sk-jcode-local}
      GROK_MODEL: ${JCODE_MODEL:-qwen3-coder-next}
      # The coder's served context window, written into ~/.grok/config.toml — without it
      # Grok Build assumes 200k for a custom model and compacts early. Default 262144 = the
      # coder's native 256k (the gateway serves it at full native context); override if a
      # different served `-c` is configured.
      GROK_CONTEXT_WINDOW: ${JCODE_GROK_CONTEXT_WINDOW:-262144}
      # Mark the container as a genuine sandbox — isolated `jcode` network (no host, db,
      # or notes) + a throwaway per-session checkout — so a CLI's root-user permission
      # guard treats it as the sandbox it is rather than refusing to run.
      IS_SANDBOX: "1"
      # Per-session web preview: the capability flag for the host-served preview
      # (JCODE_PREVIEW_BASE_HOST below) — a session's dev server is reachable at
      # <slug>-preview.<host> through the box's own tunnel + the api↔jcode proxy. ON
      # whenever code mode is — this whole profile is opt-in, so enabling jcode already
      # opts into preview; no second env var to set. The flag only gates the capability;
      # nothing is exposed until the owner opens a preview on a session (and only if a
      # base host is configured). Set JCODE_PREVIEW_ENABLED=false to withhold it. (The
      # legacy per-session cloudflared quick-tunnel was retired at the Wave P5b cutover.)
      JCODE_PREVIEW_ENABLED: ${JCODE_PREVIEW_ENABLED:-true}
      # Host-served per-session web preview (docs/archive/JCODE_PREVIEW_HOST_PLAN.md): the zone
      # previews hang under, served at <slug>-preview.<JCODE_PREVIEW_BASE_HOST> through the
      # box's own tunnel + the api↔jcode proxy. Empty (the default) fail-closes preview;
      # set it with `jbrain enable-jcode-preview`. (The legacy per-session cloudflared
      # quick-tunnel was retired at the Wave P5b cutover.)
      JCODE_PREVIEW_BASE_HOST: ${JCODE_PREVIEW_BASE_HOST:-}
      # Session GC (Wave J5): reap a session (checkout + tunnel) after this many idle
      # seconds (default 24h; 0 disables). An open terminal keeps a session fresh; a
      # deliberately-paused (stopped) session is never reaped.
      JCODE_SESSION_TTL_SECONDS: ${JCODE_SESSION_TTL_SECONDS:-86400}
      JCODE_REAP_INTERVAL_SECONDS: ${JCODE_REAP_INTERVAL_SECONDS:-600}
      # Control-server log verbosity: INFO (session + terminal lifecycle, errors) or
      # DEBUG. Pull the logs via the owner debug console (/debug/logs/jcode or
      # /debug/jcode/logs). Flip to DEBUG to chase a failure.
      JCODE_LOG_LEVEL: ${JCODE_LOG_LEVEL:-INFO}
      # Verbose by association: when debug access is on (the owner is investigating the
      # box), jcode forces DEBUG so the per-request + cloudflared-tunnel detail is in the
      # logs the debug console pulls — no separate switch. Shares the api's flag; takes
      # effect on the same `jbrain up` that enables debug access.
      JCODE_DEBUG_ACCESS_ENABLED: ${DEBUG_ACCESS_ENABLED:-false}
      # OPT-IN strict egress (Wave J5): point these at an allowlisting forward proxy to
      # confine the sandbox's outbound to git/npm (and Cloudflare, when preview is on).
      # Empty = direct NAT (the default today). git/npm/the SDK honor these; cloudflared
      # over a proxy needs on-box verification, so strict egress is opt-in, not default.
      HTTP_PROXY: ${JCODE_EGRESS_PROXY:-}
      HTTPS_PROXY: ${JCODE_EGRESS_PROXY:-}
      # Never proxy the on-box peers on the jcode network: the model gateway and `api`
      # (grok's model calls go to the api's residency-aware jcode proxy).
      NO_PROXY: ${JCODE_NO_PROXY:-api,local-llm,localhost,127.0.0.1}
    volumes:
      # The per-session git checkouts — sandbox scratch, NEVER a JBrain blob/note.
      - jcode_work:/work
    networks: [jcode]
    # Resource caps (Wave J5): an arbitrary-code sandbox must not be able to starve the
    # box. Tunable; sane ceilings for a coding session. pids_limit blunts fork bombs.
    mem_limit: ${JCODE_MEM_LIMIT:-4g}
    cpus: ${JCODE_CPUS:-2.0}
    pids_limit: ${JCODE_PIDS_LIMIT:-512}

  # The job launcher (docs/plans/JLAUNCH_PLAN.md): runs a registered long-running one-shot
  # computation (the Erdos-Straus census is the first spec) as a supervised job with a live
  # terminal, start/stop/kill, and a collectable artifact the api shares publicly. DEFAULT-ON
  # (single-user box): part of the base stack, not profile-gated — the control server is a
  # tiny idle FastAPI process until a job runs. On its own isolated network — only `api`
  # joins it (proxies the control surface + streams the artifact), so the job's arbitrary
  # code has no route to db/supervisor/worker/blobs.
  jlaunch:
    image: jbrain2-jlaunch:local
    build:
      # Repo-root context so the Dockerfile can also compile research/es-census
      # (the native census baked in for the Erdős–Straus rerun spec).
      context: ./src
      dockerfile: jlaunch/Dockerfile
    restart: unless-stopped
    environment:
      # Bearer token the api presents on every control call (fail-closed: no token, the
      # service refuses to start). Shared with the api via JBRAIN_JLAUNCH_TOKEN.
      JLAUNCH_TOKEN: ${JLAUNCH_TOKEN:-}
      JLAUNCH_WORKSPACE_ROOT: /work
      JLAUNCH_STATE_ROOT: /work/.state
      JLAUNCH_ARTIFACT_ROOT: /artifacts
      JLAUNCH_LOG_LEVEL: ${JLAUNCH_LOG_LEVEL:-INFO}
      # Verbose by association: when debug access is on, jlaunch forces DEBUG (shared flag).
      JLAUNCH_DEBUG_ACCESS_ENABLED: ${DEBUG_ACCESS_ENABLED:-false}
    volumes:
      # The per-job checkouts + ~15 GB scratch, and the collected artifacts. Both are
      # scratch/deliverables, kept OUT of backups (no owner knowledge-base data here).
      - jlaunch_work:/work
      - jlaunch_artifacts:/artifacts
    networks: [jlaunch]
    # DELIBERATELY UNCAPPED cpu/mem (unlike jcode's tight sandbox): a census run is meant
    # to saturate the box for hours — the owner opted in and accepts it competing with
    # chat/code-mode while it runs. pids_limit still blunts a fork bomb.
    pids_limit: ${JLAUNCH_PIDS_LIMIT:-2048}

  embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    restart: unless-stopped
    command: ["--model-id", "${EMBED_MODEL:-BAAI/bge-small-en-v1.5}"]
    # 4GB host: cap the model server so a bad query can't starve Postgres.
    mem_limit: 1g
    volumes:
      - embed_models:/data
    networks: [internal]

  # Self-hosted web search (docs/reference/ASSISTANT.md "Agent selection"): a SearXNG
  # metasearch instance backing the jerv chatbot's web_search/web_fetch tools.
  # Part of the stock stack (no profile) so it comes up with every deploy and is
  # recreated by `jbrain update` — the deploy tooling has no per-service enable
  # flag for it, and the api's JBRAIN_SEARXNG_URL points here by default, so a
  # gated service would just leave jerv reporting "unavailable". It needs its own
  # egress to query upstream engines, so it sits on `internal` (api/worker reach it
  # there at http://searxng:8080). Callers hold no owner data: jerv (no knowledge-base
  # tools), and the api's jcode search bridge on behalf of the sandbox CLIs (the sandbox
  # can't reach searxng directly) — so no personal context ever rides a query
  # (docs/plans/JCODE_GROK_INTERNET_PLAN.md).
  searxng:
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:latest}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # SearXNG refuses to start without a secret; set SEARXNG_SECRET in your .env.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      # The image (now granian-based, post the uwsgi→granian migration) defaults to
      # GRANIAN_HOST=:: — an IPv6 bind that crashes at boot on an IPv6-disabled Docker
      # host ("Address family not supported"), leaving searxng:8080 unreachable so the
      # jerv tool reports the service as unavailable. Pin an explicit IPv4 bind: the
      # service publishes no host port and lives only on `internal`, so 0.0.0.0 is
      # reachable by api/worker yet exposed to nothing else.
      GRANIAN_HOST: 0.0.0.0
    volumes:
      # Mount the whole /etc/searxng DIRECTORY, never the settings.yml file alone.
      # The image entrypoint runs check_directory on /etc/searxng and manages
      # settings.yml inside it (creating from template + chowning to searxng). A
      # single-file bind is a footgun: if the host file is missing the moment
      # compose runs, Docker creates an empty DIRECTORY at that path, the
      # entrypoint then sees settings.yml as a directory, and the container
      # crash-loops ("not a valid file"). A directory bind can only ever be a
      # directory, so a missing host dir just boots from the image template.
      - ./searxng:/etc/searxng
    networks: [internal]

  # Reader fallback for jerv's web_fetch (docs/reference/ASSISTANT.md "Agent selection"): an
  # on-box, r.jina.ai-compatible renderer web_fetch retries through when a direct fetch
  # is bot-walled or comes back empty (a JS-rendered page). It is the sanctioned,
  # owner-controlled stand-in for the model routing a URL through the public r.jina.ai
  # itself — only the public target URL travels in the path, to a reader the owner runs.
  # Part of the stock stack (no profile) like searxng, so it comes up with every deploy
  # and the api's JBRAIN_READER_URL points here by default; only jerv (no knowledge-base
  # tools, no owner data) reaches it. It renders with a headless browser, so it carries a
  # real memory cost and needs its own /dev/shm — heavier than searxng. To turn it off,
  # point JBRAIN_READER_URL at a non-serving endpoint or remove this service (web_fetch
  # then just reports a blocked/empty page, as before) — an EMPTY JBRAIN_READER_URL does
  # NOT disable it, since env_ignore_empty falls back to the on-box default. It needs
  # egress to fetch the target, so it sits on `internal` alongside searxng.
  reader:
    image: ${READER_IMAGE:-ghcr.io/intergalacticalvariable/reader:latest}
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 1gb  # headless Chromium crashes on the default 64m /dev/shm
    networks: [internal]

  # Bot-challenge SOLVER (docs/plans/CHALLENGE_SOLVER_PLAN.md): a stealth browser behind a
  # FlareSolverr-compatible `/v1` API (Byparr, Camoufox-backed) that clears the JS/managed
  # Cloudflare-class challenge the plain `reader` can't — the "Update Browser Required" wall
  # web_fetch escalates to only when the reader itself returns a challenge interstitial. Part
  # of the stock stack (no profile) like searxng/reader/rapidocr, so a plain `up -d` — the one
  # a PWA update runs — brings it up with NO CLI, and the api's JBRAIN_SOLVER_URL defaults to
  # it. It IS the heaviest web sidecar (a full stealth browser per solve), but it only launches
  # a solve when a fetch actually hits a wall the reader couldn't clear, so an idle box pays
  # just the process baseline (mem_limit caps a burst). To turn it off, point JBRAIN_SOLVER_URL
  # at a non-serving endpoint — an EMPTY value does NOT disable it (env_ignore_empty falls back
  # to the on-box default). On `internal` — it needs egress to reach the target and holds no
  # owner data (only jerv reaches it, like the reader).
  byparr:
    image: ${BYPARR_IMAGE:-ghcr.io/thephaseless/byparr:latest}
    restart: unless-stopped
    mem_limit: ${BYPARR_MEM_LIMIT:-2g}  # a stealth browser is heavier than the reader's Chromium
    shm_size: 2gb  # headless browser crashes on the default 64m /dev/shm
    networks: [internal]

  # Deterministic CPU OCR (docs/plans/RAPIDOCR_PLAN.md): a RapidOCR (PP-OCR / ONNX) sidecar,
  # the swap-free counterpart to the VLM `vision.ocr` path. The api reaches it at
  # http://rapidocr:8000 (JBRAIN_RAPIDOCR_URL default) to cross-validate the model's text
  # extraction and to serve the direct `ocr` tools (jerv + the jcode sandbox — the sandbox
  # can't reach it directly, the api bridges). Part of the stock stack (no profile) like
  # searxng/reader, so it comes up on every deploy; empty JBRAIN_RAPIDOCR_URL degrades to
  # VLM-only OCR. It holds NO owner data and reasons about nothing but pixels, so it sits on
  # `internal`. The engine LAZY-loads on first call and idle-unloads (server.py), so an idle
  # box pays only the ~150-200 MB process baseline, not the loaded sessions — mem_limit caps
  # a burst. CPU-only (onnxruntime), no GPU.
  rapidocr:
    image: jbrain2-rapidocr:local
    build:
      context: ./src
      dockerfile: deploy/Dockerfile.rapidocr
    restart: unless-stopped
    mem_limit: ${RAPIDOCR_MEM_LIMIT:-1g}
    environment:
      # Free the engine after this many idle seconds (0 keeps it resident once loaded).
      RAPIDOCR_IDLE_TTL_SECONDS: ${RAPIDOCR_IDLE_TTL_SECONDS:-300}
    networks: [internal]

  # OPT-IN MQTT broker (JBrain360 M0 secure spine): Mosquitto + mosquitto-go-auth
  # in HTTP-backend mode, delegating every connect/publish/subscribe to the API's
  # /internal/mqtt-* endpoints (it reuses the shipped device_key model; the plugin
  # holds no credential logic). Guarded by the `mqtt` profile so a stock deploy
  # never starts it. M0 runs a plain listener on the `internal` network ONLY — the
  # device-facing TLS :8883 listener and the MQTT->location_fixes ingest consumer
  # arrive in M1. PIN ${MQTT_IMAGE} by digest before any real deploy (go-auth is
  # archived; only the Mosquitto 2.0.x plugin ABI is supported). The mounted conf
  # path and the go-auth .so path inside the image are image-specific — verify
  # against the pinned image.
  mqtt:
    profiles: [mqtt]
    image: ${MQTT_IMAGE:-iegomez/mosquitto-go-auth:latest}
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
    networks: [internal]
    depends_on: [api]

  # The MQTT->location_fixes ingest consumer (JBrain360 M1): a server-side
  # subscriber (the same api image) that streams published OwnTracks fixes into the
  # shipped hypertable under device_context (geofence-at-ingest, L5a). Same opt-in
  # `mqtt` profile; connects to the broker as the ingest identity. Fails closed when
  # MQTT_INGEST_SECRET is unset (it logs and exits).
  mqtt-ingest:
    profiles: [mqtt]
    image: jbrain2-api:local
    restart: unless-stopped
    command: ["python", "-m", "jbrain.mqtt_consumer"]
    environment: *api_env
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy

networks:
  edge:
  internal:
  # Isolates the opt-in coding sandbox (`jcode` profile) from the rest of the stack:
  # only `jcode` + `local-llm` (and `api` from Wave J2) join it, so the arbitrary-code
  # sandbox has no network route to db/supervisor/worker/embed/blobs.
  jcode:
  # Isolates the job launcher: only `jlaunch` + `api` join it, so a job's arbitrary code
  # has no route to db/supervisor/worker/embed/blobs.
  jlaunch:

volumes:
  blobs:
  db_data:
  caddy_data:
  caddy_config:
  embed_models:
  tiles:
  # Per-session coding sandboxes (opt-in `jcode` profile) — scratch checkouts,
  # kept out of backups (no owner data lives here).
  jcode_work:
  # The job launcher's per-job checkouts + ~15 GB scratch, and its collected artifacts —
  # scratch/deliverables, kept out of backups.
  jlaunch_work:
  jlaunch_artifacts:
