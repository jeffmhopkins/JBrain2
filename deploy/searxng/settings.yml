# SearXNG settings for the jerv chatbot's web search (docs/reference/ASSISTANT.md "Agent
# selection"). The JSON format MUST be enabled
# (the default ships HTML only) — the SearxngClient speaks /search?format=json.
# The rate limiter is off because the only caller is the on-box API, not the public
# internet. Set SEARXNG_SECRET in your .env before starting the profile.
use_default_settings: true

server:
  # The official image's entrypoint replaces this placeholder with $SEARXNG_SECRET
  # at boot (an in-place edit, so the bind mount must NOT be read-only). Set
  # SEARXNG_SECRET in your .env before enabling the profile.
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: false

search:
  # JSON is required by the JBrain web_search tool; HTML stays for manual debugging.
  formats:
    - html
    - json
  # jerv asks in English and wants substance over breadth — bias results to English
  # and skip the SafeSearch filtering that drops legitimate results.
  default_lang: en
  safe_search: 0

outgoing:
  # The stock 3s per-engine timeout is the main reason a self-hosted instance returns
  # thin results: upstreams (Google/Bing/DDG) are slower to a non-browser caller, time
  # out, and get dropped — which is what pushes the model toward a third-party search.
  # A more patient timeout + a real connection pool lets more engines actually answer.
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20

# Spread each query across several independent-index engines so one engine's rate-limit
# cooldown can't blank a search. SearXNG blends + de-dupes results across every enabled
# engine, so more sources = redundancy: when DuckDuckGo/Brave hit a 429 (`suspended_time`)
# from a deep-research fan's volume, the others still answer — THIS (enabling the spread),
# not the weight below, is what fixes the blanked-search failure. Mojeek runs its own
# crawler, so it is the most throttle-resistant backup. `use_default_settings: true` merges
# this list onto the built-in engine defs BY NAME, so each entry only overrides the fields
# below (the rest of the default definition stands). `weight: 0.6` de-emphasizes DDG's
# results in the blended RANKING only — it does NOT reduce how often DDG is queried (it is
# still hit every search), so DDG can still get rate-limited; the point is just that its
# results no longer dominate now that there are five other sources.
engines:
  - name: duckduckgo
    disabled: false
    weight: 0.6
  - name: brave
    disabled: false
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: startpage
    disabled: false
  # Best-effort infobox source for web_search's zero-click "direct answer" block
  # (SearchResult.infobox) — `wikipedia` supplies an article summary + thumbnail when it
  # answers. The STRUCTURED `wikidata` source is deliberately NOT enabled: its engine runs a
  # heavy property-label SPARQL query against query.wikidata.org at STARTUP, and this box's
  # rate-limited residential IP can't complete it within the request timeout, so the engine
  # fails to register and stalls every searxng boot (a ~6s init timeout, on repeat). The
  # panel is therefore best-effort from wikipedia; the parsing/rendering surface whatever
  # infobox SearXNG returns, so re-adding wikidata is a pure config flip if WDQS ever
  # becomes reachable from here (a residential-proxy egress would do it).
  - name: wikipedia
    disabled: false
  # News-category engine for the `news_search` tool (SearxngClient.search_news queries
  # ?categories=news). It serves the `news` category only, so it DOESN'T dilute a general
  # web_search — it only answers when the news category is requested. Google News carries a
  # publish date per result, which is the freshness signal the news tool surfaces.
  # `bing news` was dropped: it returned an empty body ("Document is empty" / lxml ParserError)
  # on every query from this box, contributing nothing while adding latency — google news
  # carries the category. Broader news breadth is better served by a news API than by piling on
  # more rate-limited scraper engines (see the deep-research news notes).
  - name: google news
    disabled: false
  # Science-category engines for the `science_search` tool (SearxngClient.search_science queries
  # ?categories=science). Scholarly indexes — arXiv, PubMed, Semantic/Google Scholar, Crossref —
  # that carry authors + publish date per result. They serve the `science` category only, so they
  # never dilute a general web_search; the spread is redundancy against any one index throttling.
  - name: arxiv
    disabled: false
    # arXiv's export.arxiv.org API is chronically slow — it routinely edges past the global 6s
    # request_timeout and gets dropped (observed at ~6.2s). Give it its own timeout at the
    # max_request_timeout ceiling (10s) so it actually contributes; science searches aren't
    # latency-critical, and only arxiv waits longer, not the whole query.
    timeout: 10.0
  - name: pubmed
    disabled: false
  - name: semantic scholar
    disabled: false
  - name: crossref
    disabled: false
  - name: google scholar
    disabled: false
