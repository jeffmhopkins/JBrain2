# The browser's ONLY way off the box (docs/plans/BROWSER_AGENT_PLAN.md §2).
#
# The `browser` network is `internal: true`, so the headless browser has no gateway: every
# request it makes goes through this proxy or nowhere. Squid resolves each hostname itself and
# checks the RESOLVED address against the deny list below, so a name that resolves to the
# metadata endpoint, a LAN host or a compose service is refused no matter what it is called.
# Playwright's own origin flags are "not a security boundary" (its docs); this file is.
#
# Every compose service name is denied by name too (`compose_services`), and any single-label
# host — the shape every Docker DNS name has — is denied outright, so a service added later
# without an entry here is still refused. test_browser_compose.py keeps the name list in step
# with the compose file.

http_port 3128

# Nothing is cached: the proxy exists to say no, not to keep copies of what the browser read.
cache deny all
cache_mem 0 MB

# Do not tell upstream sites where the request came from inside the box.
via off
forwarded_for delete
httpd_suppress_version_string on

# A ceiling on any one plain-HTTP response. Nothing here is written to disk (no cache_dir, no
# access log), so this bounds memory per request; TLS bodies pass through a CONNECT tunnel the
# proxy cannot see into, and those are bounded by the browser's own tmpfs instead.
reply_body_max_size 50 MB

# No access log. Squid drops to the `proxy` user before opening it, which cannot write the
# container's stdout, and a log file inside the container would grow with every page the
# browser loads. A refusal is visible where it matters: the browser receives Squid's
# "access denied" page, which lands in the browse step trace.
access_log none
pid_filename none
visible_hostname egress
pinger_enable off

acl web_ports port 80 443
acl tls_port port 443
acl CONNECT method CONNECT

# Every non-public range: "this" network, RFC1918, CGNAT, loopback, link-local (the cloud
# metadata address 169.254.169.254 lives here), IETF protocol assignments, TEST-NETs,
# benchmarking, multicast and reserved; and for IPv6 the unspecified and loopback addresses,
# IPv4-mapped and NAT64 forms (so a private v4 cannot hide behind a v6 spelling), ULA,
# link-local, documentation and multicast. (On a Docker network without IPv6 Squid logs that
# it skipped the v6 entries; it then has no v6 route to connect over either.)
acl non_public dst 0.0.0.0/8
acl non_public dst 10.0.0.0/8
acl non_public dst 100.64.0.0/10
acl non_public dst 127.0.0.0/8
acl non_public dst 169.254.0.0/16
acl non_public dst 172.16.0.0/12
acl non_public dst 192.0.0.0/24
acl non_public dst 192.0.2.0/24
acl non_public dst 192.168.0.0/16
acl non_public dst 198.18.0.0/15
acl non_public dst 198.51.100.0/24
acl non_public dst 203.0.113.0/24
acl non_public dst 224.0.0.0/4
acl non_public dst 240.0.0.0/4
acl non_public dst ::/128
acl non_public dst ::1/128
acl non_public dst ::ffff:0:0/96
acl non_public dst 64:ff9b::/96
acl non_public dst fc00::/7
acl non_public dst fe80::/10
acl non_public dst 2001:db8::/32
# 6to4 and Teredo embed an IPv4 address the rules above would otherwise never see.
acl non_public dst 2002::/16
acl non_public dst 2001::/32
acl non_public dst ff00::/8

# Every compose service, by name. Resolving one gives a private address the rule above
# already refuses; naming them here means the refusal does not depend on that resolution.
acl compose_services dstdomain api worker migrate wipe db supervisor wall proxy cloudflared
acl compose_services dstdomain local-llm flash-next comfyui tts-stt jcode jlaunch embed
acl compose_services dstdomain searxng reader byparr rapidocr htmlrender pysandbox sdr
acl compose_services dstdomain endpoint mqtt mqtt-ingest browser egress
# A name with no dot is never a public site, and it is the exact shape of a Docker DNS name.
acl single_label dstdom_regex -i ^[^.]+$
# A `.local`/`.internal`/`.lan`/`.home.arpa` name is a LAN host by definition.
acl lan_suffix dstdomain .local .internal .lan .localdomain .home.arpa .localhost

http_access deny !web_ports
http_access deny CONNECT !tls_port
http_access deny compose_services
http_access deny single_label
http_access deny lan_suffix
http_access deny non_public
# Only the containers on the fenced `browser` network can reach this port at all (Docker
# network membership), so what is left is public http(s) on the standard ports.
http_access allow all
