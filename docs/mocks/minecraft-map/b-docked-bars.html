<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Minecraft Map · B — Docked bars</title>
<!-- GUI gate mock — docs/mocks/minecraft-map/README.md. Spec: docs/plans/MINECRAFT_BEDROCK_PLAN.md §M8, §M8a, §T1
     and P3 "The map tool-view". Reached from the binding Minecraft screen (frontend/src/screens/MinecraftScreen.tsx).
     Self-contained and offline; tokens per docs/reference/DESIGN.md. The map picture is drawn procedurally. -->
<style>
/* ===== tokens — copied from frontend/src/styles/tokens.css (drawn at 100% text size) ===== */
  :root{
    color-scheme:dark;
    --bg:#0E0F11; --surface:#17181B; --surface-2:#1E2024; --border:#26282C;
    --text:#E6E7E9; --text-2:#9A9DA3; --text-3:#5C5F66; --surface-composer:#141518;
    --scrim:rgba(14,15,17,.6);
    --steel:#7FA7C9; --green:#8FBC9A; --amber:#C9A36A; --rose:#CF8A8F; --violet:#A493C9;
    --steel-tint:rgba(127,167,201,.13); --green-tint:rgba(143,188,154,.13);
    --amber-tint:rgba(201,163,106,.13); --rose-tint:rgba(207,138,143,.13); --violet-tint:rgba(164,147,201,.13);
    --ok:var(--green); --warn:var(--amber); --danger:var(--rose); --info:var(--steel);
    --r-input:12px; --r-seg:14px; --r-card:16px; --r-pill:999px;
    --fs-micro:12px; --fs-head:13px; --fs-secondary:14px; --fs-body:16px; --fs-title:18px; --fs-screen:22px; --fs-hero:28px; --fs-chat:20px;
    --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --shadow-card:none;
    --ok-text:var(--green); --warn-text:var(--amber); --danger-text:var(--rose); --steel-text:var(--steel);
    /* Map-only tokens (this surface's proposal — see README "Assumptions"). The void, the
       explored-by veil, the glyph halo and the glyph ink are part of the picture, so they stay
       dark (ink light) in BOTH themes; only the label plate follows the theme. */
    --map-fog:#0B0C0E; --map-void:#141518; --map-halo:rgba(8,9,11,.9); --map-plate:rgba(23,24,27,.9);
    --map-ink:#F2F2F2; --map-ink-on:#0E0F11;
    --frame:#2A2C30; --page:#000;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  [data-theme="light"]{
    color-scheme:light;
    --bg:#F7F7F5; --surface:#FFFFFF; --surface-2:#F0F0EE; --border:#E2E2DF;
    --text:#1A1B1E; --text-2:#5C5F66; --text-3:#9A9DA3; --surface-composer:#FFFFFF;
    --scrim:rgba(247,247,245,.6); --shadow-card:0 1px 2px rgba(0,0,0,.06);
    --ok-text:color-mix(in srgb, var(--green) 46%, var(--text));
    --warn-text:color-mix(in srgb, var(--amber) 50%, var(--text));
    --danger-text:color-mix(in srgb, var(--rose) 54%, var(--text));
    --steel-text:color-mix(in srgb, var(--steel) 52%, var(--text));
    --map-fog:#0B0C0E; --map-void:#1E2024; --map-halo:rgba(8,9,11,.85); --map-plate:rgba(255,255,255,.92);
    --frame:#C9C9C4; --page:#DADAD6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--page);color:var(--text);display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0 40px;min-height:100vh;line-height:1.4;}
  svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;width:20px;height:20px;}
  button{font:inherit;color:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--steel);outline-offset:2px;}
  [hidden]{display:none !important;}
  .num{font-variant-numeric:tabular-nums;}
  .mono{font-family:var(--font-mono);}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  /* ===== reviewer chrome — OUTSIDE the design ===== */
  .caption{max-width:390px;width:100%;padding:0 16px;color:var(--text-2);font-size:13px;line-height:1.55;}
  .caption b{color:var(--text);font-weight:500;}
  .caption .tag{display:inline-block;background:var(--steel-tint);color:var(--steel-text);font-size:11px;padding:2px 8px;border-radius:999px;margin-bottom:6px;}
  .sim{max-width:390px;width:calc(100% - 32px);padding:10px 12px;background:transparent;border:1px dashed var(--text-3);border-radius:14px;display:flex;flex-direction:column;gap:8px;}
  .sim .stitle{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);}
  .sim .srow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .sim .sl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);width:62px;flex:none;}
  .sim button{appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:11.5px;padding:5px 10px;border-radius:999px;}
  .sim button[aria-pressed="true"]{background:var(--steel-tint);border-color:transparent;color:var(--steel-text);font-weight:600;}

  /* ===== the phone ===== */
  .phone{width:390px;height:820px;background:var(--bg);border:1px solid var(--frame);border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
  @media (max-width:430px){
    body{padding-top:12px;}
    .phone{width:100%;height:100dvh;border-radius:0;border-left:0;border-right:0;}
  }
  @media (min-width:900px){ .phone{width:560px;} .caption,.sim{max-width:560px;} }

  /* ===== shared atoms (mirrored from the built Minecraft screen, frontend/src/styles.css .mc-*) ===== */
  .bar{height:56px;display:flex;align-items:center;gap:6px;padding:0 12px 0 4px;border-bottom:1px solid var(--border);flex:none;background:var(--bg);}
  .bar .back,.icon-btn{appearance:none;background:none;border:none;color:var(--text-2);width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:var(--r-input);}
  .bar .ttl{font-size:var(--fs-screen);font-weight:500;}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-micro);border-radius:999px;padding:2px 9px;white-space:nowrap;}
  .badge.ok{color:var(--ok-text);background:var(--green-tint);} .badge.warn{color:var(--warn-text);background:var(--amber-tint);}
  .badge.bad{color:var(--danger-text);background:var(--rose-tint);} .badge.info{color:var(--steel-text);background:var(--steel-tint);}
  .badge.off{color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);}
  .dot{width:8px;height:8px;border-radius:999px;flex:none;display:inline-block;}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--green-tint);} .dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--amber-tint);}
  .dot.bad{background:var(--danger);box-shadow:0 0 0 3px var(--rose-tint);} .dot.off{background:var(--text-3);}
  .btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;border-radius:var(--r-input);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-secondary);font-weight:500;white-space:nowrap;}
  .btn svg{width:18px;height:18px;}
  .btn.primary{background:var(--steel-tint);border-color:transparent;color:var(--steel-text);}
  .btn.go{background:var(--green-tint);border-color:transparent;color:var(--ok-text);}
  .btn:disabled{background:var(--surface-2);border-color:var(--border);color:var(--text-3);cursor:default;}
  .btn.grow{flex:1;min-width:0;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;}
  .sect{font-size:var(--fs-micro);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
  .note{font-size:var(--fs-micro);color:var(--text-2);line-height:1.45;}
  .note b{color:var(--text);font-weight:500;}
  .notice{display:flex;gap:9px;align-items:flex-start;border-radius:var(--r-input);padding:10px 12px;font-size:var(--fs-micro);line-height:1.45;color:var(--text);}
  .notice svg{width:16px;height:16px;margin-top:1px;}
  .notice b{font-weight:500;}
  .notice.warn{background:var(--amber-tint);} .notice.warn svg{color:var(--warn-text);}
  .notice.bad{background:var(--rose-tint);} .notice.bad svg{color:var(--danger-text);}
  .notice.info{background:var(--steel-tint);} .notice.info svg{color:var(--steel-text);}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-input);padding:3px;gap:2px;}
  .seg button{appearance:none;flex:1;min-width:0;min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--text-2);font-size:var(--fs-head);font-weight:500;padding:0 4px;white-space:nowrap;}
  .seg button[aria-checked="true"]{background:var(--steel-tint);color:var(--text);}
  .seg button:disabled{color:var(--text-3);cursor:default;}
  .switch{appearance:none;width:44px;min-width:44px;height:26px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);position:relative;flex:none;}
  .switch::after{content:"";position:absolute;inset:-10px -2px;}
  .switch .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:var(--text-3);transition:left .15s ease-out,background .15s ease-out;}
  .switch[aria-checked="true"]{background:var(--steel-tint);border-color:transparent;} .switch[aria-checked="true"] .knob{left:21px;background:var(--steel);}
  .switch:disabled{cursor:default;border-style:dashed;}

  /* modal shells — one Sheet, one toast (DESIGN "Modal system") */
  .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .16s ease-out;z-index:40;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .18s ease-out;z-index:41;padding:0 16px calc(16px + env(safe-area-inset-bottom));max-height:86%;overflow:auto;visibility:hidden;}
  .sheet.show{transform:translateY(0);visibility:visible;}
  .grip{width:32px;height:4px;border-radius:999px;background:var(--border);margin:10px auto 12px;}
  .sheet h3{font-size:var(--fs-title);font-weight:500;}
  #toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:10px 16px;font-size:var(--fs-micro);color:var(--text);opacity:0;pointer-events:none;transition:.18s ease-out;max-width:88%;z-index:60;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.up{bottom:var(--toast-up,120px);}

  /* ===== the map viewport (shared component) ===== */
  .mv{position:relative;overflow:hidden;background:var(--map-void);touch-action:none;user-select:none;-webkit-user-select:none;}
  .mv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;}
  .mv.inline{touch-action:pan-y;}
  .fab{appearance:none;width:44px;height:44px;border-radius:var(--r-input);background:var(--surface);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card);flex:none;}
  .fab svg{width:20px;height:20px;}
  .fab[aria-pressed="true"]{background:color-mix(in srgb, var(--steel) 13%, var(--surface));color:var(--steel-text);border-color:var(--steel);}
  .fabcol{display:flex;flex-direction:column;gap:8px;}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:var(--fs-micro);color:var(--text);box-shadow:var(--shadow-card);white-space:nowrap;}
  .pill .muted{color:var(--text-2);}

  /* map-status line (honest status: snapshot time, live or not) */
  .mstat{display:flex;align-items:center;gap:8px;font-size:var(--fs-micro);color:var(--text-2);line-height:1.35;min-width:0;}
  .mstat b{color:var(--text);font-weight:500;}
  .mstat .spin{width:14px;height:14px;border-radius:999px;border:1.5px solid var(--text-3);border-top-color:var(--steel);animation:spin .9s linear infinite;flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .mstat .mstat-tx{flex:1;min-width:0;}
  .mstat.time b{color:var(--warn-text);}
  .mstat-live{flex:none;min-height:44px;padding:0 12px;font-size:var(--fs-micro);}

  /* layer picker */
  .ly-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .ly{appearance:none;display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-input);padding:8px 10px;min-height:56px;min-width:0;}
  .ly[aria-checked="true"]{border-color:var(--steel);background:var(--steel-tint);}
  .ly:disabled{cursor:default;border-style:dashed;}
  .ly:disabled .lt{color:var(--text-2);}
  .ly .sw.later{background:var(--surface);border-style:dashed;}
  .ly .sw{width:32px;height:32px;border-radius:8px;flex:none;image-rendering:pixelated;border:1px solid var(--border);}
  .ly .lt{display:block;font-size:var(--fs-secondary);font-weight:500;color:var(--text);}
  .ly .ls{display:block;font-size:var(--fs-micro);color:var(--text-2);line-height:1.3;}
  .ly-who{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .ov{display:flex;align-items:center;gap:12px;min-height:48px;padding:2px 0;}
  .ov + .ov{border-top:1px solid var(--border);}
  .ov .gl{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--text-2);}
  .ov .gl svg{width:18px;height:18px;}
  .ov .ot{flex:1;min-width:0;font-size:var(--fs-secondary);}
  .ov .ot small{display:block;font-size:var(--fs-micro);color:var(--text-2);}
  .ov.later .ot{color:var(--text-2);}
  .dims{display:flex;}

  /* chips (players, explored-by) */
  .chip{appearance:none;display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:var(--fs-micro);font-weight:500;position:relative;white-space:nowrap;}
  .chip::after{content:"";position:absolute;inset:-4px -2px;}
  .chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--steel-tint);color:var(--text);border-color:var(--steel);}
  .chip .pd{width:10px;height:10px;border-radius:999px;flex:none;border:1.5px solid currentColor;}
  .chip[aria-pressed="true"] .pd,.chip[aria-checked="true"] .pd{border-color:transparent;}
  .chip .on{font-size:var(--fs-micro);color:var(--ok-text);}

  /* legend */
  .lg{display:flex;flex-direction:column;gap:8px;}
  .lg-row{display:flex;flex-wrap:wrap;gap:6px 14px;}
  .lg-i{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-micro);color:var(--text-2);}
  .lg-i i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none;border:1px solid var(--border);}
  .lg-i svg{width:14px;height:14px;}
  .lg-ramp{height:10px;border-radius:999px;border:1px solid var(--border);}
  .lg-ends{display:flex;justify-content:space-between;font-size:var(--fs-micro);color:var(--text-2);}

  /* detail (what you tapped) */
  .det{display:flex;flex-direction:column;gap:10px;}
  .det-h{display:flex;align-items:flex-start;gap:10px;}
  .det-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);}
  .det-ic svg{width:18px;height:18px;}
  .det-ic.death{background:var(--rose-tint);border-color:transparent;color:var(--danger-text);}
  .det-ic.pl{border-color:transparent;color:var(--map-ink-on);font-weight:700;font-size:var(--fs-secondary);}
  .det-ic.st{color:var(--warn-text);background:var(--amber-tint);border-color:transparent;}
  .det-tx{flex:1;min-width:0;}
  .det-t{font-size:var(--fs-body);font-weight:500;overflow-wrap:anywhere;}
  .det-s{font-size:var(--fs-micro);color:var(--text-2);margin-top:2px;line-height:1.4;}
  .coord{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-input);padding:6px 6px 6px 12px;min-width:0;}
  .coord .xyz{flex:1;min-width:0;font-family:var(--font-mono);font-size:var(--fs-body);font-variant-numeric:tabular-nums;line-height:1.3;display:flex;flex-wrap:wrap;gap:0 12px;}
  .coord .xyz span{white-space:nowrap;}
  .coord .xyz em{font-style:normal;color:var(--text-2);margin-right:4px;}
  .coord .btn{flex:none;padding:0 12px;}
  .det .alt{font-size:var(--fs-micro);color:var(--text-2);}
  .det .alt b{color:var(--text);font-weight:500;font-family:var(--font-mono);}

  .selrow{display:flex;align-items:center;gap:10px;min-width:0;}
  .selrow .det-tx{flex:1;min-width:0;}
  .selrow .sr-t{font-size:var(--fs-secondary);font-weight:500;overflow-wrap:anywhere;line-height:1.3;}
  .selrow .sr-c{font-size:var(--fs-micro);color:var(--text-2);font-variant-numeric:tabular-nums;}
  .selrow .sr-copy{width:44px;padding:0;flex:none;}
  .selrow .det-ic{width:30px;height:30px;}
  .nudge{display:flex;align-items:center;gap:2px;}
  .nudge .note{flex:1;}
  .nudge .icon-btn{color:var(--text);background:var(--surface-2);border:1px solid var(--border);}
  .lg-n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:999px;background:var(--map-halo);color:var(--map-ink);font-size:var(--fs-micro);font-weight:700;flex:none;}

  /* ===== timeline (M8a) ===== */
  .tl{display:flex;flex-direction:column;gap:4px;}
  .tl-top{display:flex;align-items:center;gap:8px;min-width:0;}
  .tl-play{appearance:none;width:44px;height:44px;border-radius:999px;border:0;background:var(--steel-tint);color:var(--steel-text);display:flex;align-items:center;justify-content:center;flex:none;}
  .tl-play svg{width:18px;height:18px;}
  .tl-speed{appearance:none;min-width:52px;height:44px;border-radius:var(--r-input);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-secondary);font-weight:600;font-variant-numeric:tabular-nums;flex:none;padding:0 8px;}
  .tl-when{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;}
  .tl-when b{font-size:var(--fs-body);font-weight:500;font-variant-numeric:tabular-nums;}
  .tl-when span{font-size:var(--fs-micro);color:var(--text-2);}
  .tl-now{appearance:none;min-height:44px;padding:0 12px;border-radius:var(--r-input);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-micro);font-weight:500;display:inline-flex;align-items:center;gap:6px;flex:none;}
  .tl-now[aria-pressed="true"]{background:var(--green-tint);border-color:transparent;color:var(--ok-text);}
  .tl-scrub{position:relative;height:88px;touch-action:none;margin:0 2px;}
  .tl-marks{position:absolute;left:0;right:0;top:0;height:44px;}
  .tl-mk{appearance:none;position:absolute;top:0;width:44px;height:44px;margin-left:-22px;border:0;background:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;color:var(--text-2);}
  .tl-mk svg{width:16px;height:16px;}
  .tl-mk.death{color:var(--danger-text);}
  .tl-mk.dim{color:var(--violet);}
  .tl-mk .n{position:absolute;top:0;right:2px;font-size:var(--fs-micro);font-weight:600;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;min-width:18px;height:18px;line-height:16px;text-align:center;padding:0 3px;}
  .tl-more{margin-top:10px;}
  .tl-track{position:absolute;left:0;right:0;top:44px;height:44px;cursor:pointer;}
  .tl-rail{position:absolute;left:0;right:0;top:19px;height:6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);}
  .tl-sess{position:absolute;top:19px;height:6px;border-radius:999px;opacity:.55;}
  .tl-fill{position:absolute;left:0;top:19px;height:6px;border-radius:999px;background:var(--steel);}
  .tl-thumb{position:absolute;top:8px;width:28px;height:28px;margin-left:-14px;border-radius:999px;background:var(--surface);border:2px solid var(--steel);box-shadow:0 0 0 4px var(--steel-tint);pointer-events:none;}
  .tl-ends{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:var(--fs-micro);color:var(--text-2);font-variant-numeric:tabular-nums;margin-top:-2px;}
  .tl-chips{display:flex;flex-wrap:wrap;gap:6px 6px;}
  .tl-step{display:flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-input);padding:0 2px;min-height:52px;}

const NB = ' ';

function dayDiff(t) { const a = new Date(t), b = new Date(NOW); return Math.round((new Date(b.getFullYear(), b.getMonth(), b.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate())) / DAY); }

  expandFromChat() { const ev = DEATH9(); CUR = 'live'; B.ret = 'chat'; B.dock = false; S.dim = 'n'; S.sel = CHAT.sel || { ...ev, kind: 'death', dim: ev.d }; this.render(); this.view.center(S.sel.x + .5, S.sel.z + .5, 2); this.place(); buildSim(); },
};

APP.view = new MapView($('map'), { main: true, x: 130, z: -250, s: .7, gridTop: 52, floatSel: '#b-zoom .fab, #b-keybtn .fab, .b-keycard, #b-co',
  onTap: (hit) => { if (hit.kind === 'player') S.tl.focus = hit.player; APP.select(hit.kind === 'spot' && S.sel && S.sel.kind === 'spot' ? null : hit); },
  onView: () => APP.place && APP.place(),
  onFollowOff: () => APP.renderDock() });

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.closest('#sim')) return;
  const a = b.dataset.act;
  if (a.startsWith('cov:')) { CHAT.ov[a.slice(4)] = !CHAT.ov[a.slice(4)]; APP.render(); return; }
  if (a === 'expand') { APP.expandFromChat(); return; }
  if (a === 'open-map') { CUR = 'live'; applyState('live'); APP.state('live'); buildSim(); return; }
  if (a === 'back') { CUR = B.ret === 'chat' ? 'chat' : 'entry'; applyState(CUR); APP.render(); buildSim(); return; }
  if (a === 'zin') { APP.view.zoomBy(1.6); return; }
  if (a === 'zout') { APP.view.zoomBy(1 / 1.6); return; }
  if (a === 'key') { B.key = !B.key; APP.render(); return; }
  if (a === 'dock') { B.dock = !B.dock; if (B.dock) tlStart(S.tl.preset || 'session'); else tlStop(); S.sel = null; redrawAll(); APP.render(); return; }
  if (a === 'layers') { openSheet('layers'); return; }
  if (a === 'worlds') { openSheet('worlds'); return; }
  if (a.startsWith('slot:')) { S.slot = +a.slice(5); S.dim = 'o'; S.sel = null; B.dock = false; tlStop(); closeSheet(); APP.view.center(0, 0, S.slot === 2 ? .7 : .5); redrawAll(); APP.render(); return; }
  if (a === 'dismiss') { closeSheet(); return; }
  if (a.startsWith('follow:') || a.startsWith('sessions:') || a.startsWith('replay:')) B.dock = true;
  commonAct(a, b);
  if (B.sheet === 'layers' && (a.startsWith('layer:') || a.startsWith('ov:') || a.startsWith('exby:') || a.startsWith('dim:'))) openSheet('layers');
});
function openSheet(kind) {
  const sh = $('sheet'); B.sheet = kind;
  if (kind === 'layers') sh.innerHTML = `<div class="grip"></div><div class="b-sheetbody">${B.dock ? `<div class="sect" style="margin-bottom:8px">Dimension</div>${htmlDims('seg')}<div style="height:14px"></div>` : ''}${htmlLayers()}</div>`;
  else sh.innerHTML = `<div class="grip"></div><h3 style="margin-bottom:4px">Map of…</h3><p class="note" style="margin-bottom:8px">Any world slot. Only the loaded one shows live positions.</p><div class="wl">${WORLDS.map(w => `<button class="navrow" data-act="slot:${w.slot}" aria-current="${S.slot === w.slot}" ${w.kind === 'free' ? 'disabled' : ''}><span class="ico" aria-hidden="true">${IC.globe}</span><span class="tx"><span class="t">${esc(w.name)}</span><span class="m">Slot ${w.slot} · ${worldLine(w)}</span></span>${w.loaded ? '<span class="badge ok">loaded</span>' : ''}</button>`).join('')}</div>`;
  sh.setAttribute('aria-label', kind === 'layers' ? 'Layers' : 'Choose a world');
  const was = sh.classList.contains('show'); sh.classList.add('show'); $('scrim').classList.add('show'); if (!was) sh.querySelector('button').focus();
}
function closeSheet() { B.sheet = null; $('sheet').classList.remove('show'); $('scrim').classList.remove('show'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
/* swipe the sheet down to close it */
(() => { const sh = $('sheet'); let y0 = null; sh.addEventListener('pointerdown', e => { if (sh.scrollTop <= 0) y0 = e.clientY; }); sh.addEventListener('pointerup', e => { if (y0 !== null && e.clientY - y0 > 60) closeSheet(); y0 = null; }); })();

applyState('live'); APP.state('live'); buildSim();
</script>
</body>
</html>
