<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Minecraft map layers · Villagers & pets B</title>
<!-- GUI gate mock — docs/mocks/minecraft-map-layers/README.md. Three map follow-ups the owner asked for on
     2026-10-13: saved places (app.mc_places), villagers and pets (plan §M4e's entity index), and beds and respawn
     points. Built on the binding map and markers mocks (docs/mocks/minecraft-map/a-full-bleed.html,
     docs/mocks/minecraft-map-markers/a-always-drawn.html; shipped as frontend/src/screens/MinecraftMap.tsx and
     minecraftMapDraw.ts): tokens, panel, floating chrome, the marker grammar and the label rule are copied from them.
     The map picture is drawn procedurally; terrain colours are raw RGB inside the image. Self-contained and offline. -->
<style>
  :root{
    color-scheme:dark;
    --bg:#0E0F11; --surface:#17181B; --surface-2:#1E2024; --border:#26282C;
    --text:#E6E7E9; --text-2:#9A9DA3; --text-3:#5C5F66;
    --steel:#7FA7C9; --green:#8FBC9A; --amber:#C9A36A; --rose:#CF8A8F; --violet:#A493C9;
    --steel-tint:rgba(127,167,201,.13); --green-tint:rgba(143,188,154,.13); --amber-tint:rgba(201,163,106,.13); --violet-tint:rgba(164,147,201,.13);
    --ok:var(--green);
    --r-input:12px; --r-card:16px; --r-pill:999px;
    --fs-micro:12px; --fs-head:13px; --fs-secondary:14px; --fs-body:16px; --fs-title:18px;
    --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --shadow-card:none;
    --ok-text:var(--green); --warn-text:var(--amber); --steel-text:var(--steel);
    --violet-text:var(--violet);
    --map-void:#141518; --map-fog:#0b0c0e; --map-halo:rgba(8,9,11,.9); --map-plate:rgba(23,24,27,.9);
    --map-ink:#f2f2f2; --map-ink-on:#0e0f11;
    --frame:#2A2C30; --page:#000;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  [data-theme="light"]{
    color-scheme:light;
    --bg:#F7F7F5; --surface:#FFFFFF; --surface-2:#F0F0EE; --border:#E2E2DF;
    --text:#1A1B1E; --text-2:#5C5F66; --text-3:#9A9DA3;
    --shadow-card:0 1px 2px rgba(0,0,0,.06);
    --ok-text:color-mix(in srgb, var(--green) 46%, var(--text));
    --warn-text:color-mix(in srgb, var(--amber) 50%, var(--text));
    --steel-text:color-mix(in srgb, var(--steel) 52%, var(--text));
    --violet-text:color-mix(in srgb, var(--violet) 52%, var(--text));
    --map-void:#1e2024; --map-halo:rgba(8,9,11,.85); --map-plate:rgba(255,255,255,.92);
    --frame:#C9C9C4; --page:#DADAD6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--page);color:var(--text);display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0 40px;min-height:100vh;line-height:1.4;}
  svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;width:18px;height:18px;}
  button{font:inherit;color:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--steel);outline-offset:2px;}
  .num{font-variant-numeric:tabular-nums;}

  /* reviewer chrome — OUTSIDE the design */
  .caption{max-width:390px;width:100%;padding:0 16px;color:var(--text-2);font-size:13px;line-height:1.55;}
  .caption b{color:var(--text);font-weight:500;}
  .sim{max-width:390px;width:calc(100% - 32px);padding:10px 12px;border:1px dashed var(--text-3);border-radius:14px;display:flex;flex-direction:column;gap:8px;}
  .sim .stitle{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);}
  .sim .srow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .sim .sl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);width:62px;flex:none;}
  .sim button{appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:11.5px;padding:5px 10px;border-radius:999px;}
  .sim button[aria-pressed="true"]{background:var(--steel-tint);border-color:transparent;color:var(--steel-text);font-weight:600;}
  body.shot .caption, body.shot .sim{display:none;}
  body.shot{padding:0;gap:0;}

  .phone{width:390px;height:820px;background:var(--bg);border:1px solid var(--frame);border-radius:34px;overflow:hidden;position:relative;}
  body.shot .phone{border-radius:0;border:0;width:100vw;height:100vh;}
  @media (max-width:430px){ .phone{width:100%;height:100dvh;border-radius:0;border-left:0;border-right:0;} }

  /* ===== the map (absolute sizes: the .mc-map* exemption) ===== */
  .map{position:absolute;inset:0;}
  .map canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:5;}
  .fab{appearance:none;width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:var(--r-input);background:var(--surface);border:1px solid var(--border);color:var(--text);box-shadow:var(--shadow-card);}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-input);padding:3px;gap:2px;}
  .seg button{appearance:none;flex:1;min-width:0;min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--text-2);font-size:13px;font-weight:500;padding:0 6px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .seg button[aria-selected="true"],.seg button[aria-checked="true"]{background:var(--steel-tint);color:var(--text);}
  .dims{flex:1;max-width:280px;margin-left:auto;background:var(--surface);}
  .fabs{position:absolute;right:12px;top:68px;z-index:5;display:flex;flex-direction:column;gap:8px;}
  .scale{position:absolute;left:12px;z-index:5;display:flex;align-items:center;gap:8px;background:var(--map-plate);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--text);}
  .scale i{display:block;width:40px;height:6px;border:1.5px solid var(--text);border-top:0;}

  /* ===== the persistent panel ===== */
  .panel{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;box-shadow:var(--shadow-card);overflow:hidden;}
  .grip{width:32px;height:4px;margin:7px auto 4px;border-radius:999px;background:var(--border);flex:none;}
  .head{display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;flex:none;}
  .world{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;border:0;background:none;font-size:var(--fs-title);font-weight:500;white-space:nowrap;}
  .world svg{color:var(--text-2);width:16px;height:16px;}
  .tabs{margin-left:auto;flex:none;}
  .tabs button{padding:0 10px;font-size:var(--fs-head);}
  .tabs svg{width:16px;height:16px;}
  @media (max-width:360px){ .tabs svg{display:none;} .tabs button{padding:0 8px;} }
  .stat{display:flex;align-items:center;gap:8px;min-height:44px;padding:2px 16px 0;font-size:var(--fs-micro);color:var(--text-2);line-height:1.35;flex:none;}
  .stat .dot{width:8px;height:8px;border-radius:999px;background:var(--ok);box-shadow:0 0 0 3px var(--green-tint);flex:none;}
  .stat b{display:block;color:var(--text);font-weight:500;}
  .stat.old .dot{background:var(--text-3);box-shadow:none;}
  .pbody{flex:1;overflow:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px;}
  .sect{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);margin-top:6px;}
  .note{font-size:var(--fs-micro);color:var(--text-2);line-height:1.45;}

  /* what you tapped */
  .det{display:flex;flex-direction:column;gap:10px;padding:2px 16px 16px;flex:none;}
  .det-h{display:flex;align-items:flex-start;gap:10px;}
  .det-ic{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid transparent;}
  .det-ic.gate{background:var(--violet-tint);color:var(--violet-text);}
  .det-ic.bea{background:var(--green-tint);color:var(--ok-text);}
  .det-tx{flex:1;min-width:0;}
  .det-t{font-size:var(--fs-body);font-weight:500;overflow-wrap:anywhere;}
  .det-s{margin-top:2px;font-size:var(--fs-micro);line-height:1.4;color:var(--text-2);}
  .det-s b{color:var(--text);font-weight:500;}
  .state{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-micro);border-radius:999px;padding:1px 8px;white-space:nowrap;font-weight:500;}
  .state.open{color:var(--violet-text);background:var(--violet-tint);}
  .state.dorm{color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);}
  .state.prot{color:var(--ok-text);background:var(--green-tint);}
  .x{appearance:none;width:44px;height:44px;margin:-6px -10px 0 0;border:0;background:none;color:var(--text-2);display:flex;align-items:center;justify-content:center;flex:none;}
  .coord{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-input);}
  .xyz{flex:1;font-size:var(--fs-secondary);font-variant-numeric:tabular-nums;}
  .lnk{appearance:none;background:none;border:0;color:var(--steel-text);font-size:var(--fs-micro);font-weight:500;min-height:44px;padding:0 8px;display:inline-flex;align-items:center;gap:5px;}
  .lead{display:flex;align-items:center;gap:8px;font-size:var(--fs-secondary);color:var(--text-2);}
  .lead svg{color:var(--violet-text);width:18px;height:18px;}
  .lead b{color:var(--text);font-weight:500;}
  .btnrow{display:flex;gap:8px;}
  .btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;border-radius:var(--r-input);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-secondary);font-weight:500;flex:1;}
  .btn.primary{background:var(--steel-tint);border-color:transparent;color:var(--steel-text);}

  /* layers tab */
  .ly-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .ly{appearance:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-input);}
  .ly[aria-checked="true"]{border-color:var(--steel);background:var(--steel-tint);}
  .ly .sw{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);flex:none;}
  .ly-t{display:block;font-size:var(--fs-secondary);font-weight:500;}
  .ly-s{display:block;font-size:var(--fs-micro);color:var(--text-2);line-height:1.3;}
  .ov{display:flex;align-items:center;gap:12px;min-height:48px;padding:2px 0;}
  .ov + .ov{border-top:1px solid var(--border);}
  .ov-gl{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text-2);}
  .ov-gl.gate{color:var(--violet-text);} .ov-gl.bea{color:var(--ok-text);}
  .ov-t{flex:1;min-width:0;font-size:var(--fs-secondary);}
  .ov-t small{display:block;font-size:var(--fs-micro);color:var(--text-2);}
  .ov.later .ov-t{color:var(--text-2);}
  .badge{display:inline-flex;font-size:var(--fs-micro);border-radius:999px;padding:2px 9px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);}
  .switch{appearance:none;width:44px;height:26px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);position:relative;flex:none;}
  .switch::after{content:"";position:absolute;inset:-9px 0;}
  .switch .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:var(--text-3);}
  .switch.on{background:var(--steel-tint);border-color:transparent;} .switch.on .knob{left:21px;background:var(--steel);}
  .sub-seg{margin:0 0 6px 40px;}
  .sub-seg button{font-size:var(--fs-micro);}
  .lg{display:flex;flex-direction:column;gap:8px;}
  .lg-row{display:flex;flex-wrap:wrap;gap:6px 14px;}
  .lg-i{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-micro);color:var(--text-2);}
  .lg-i canvas{width:22px;height:22px;flex:none;}
  .list{display:flex;flex-direction:column;}
  .li{appearance:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0;border:0;border-top:1px solid var(--border);background:none;text-align:left;width:100%;}
  .li:first-child{border-top:0;}
  .li .lt{flex:1;min-width:0;}
  .li .lt b{display:block;font-size:var(--fs-secondary);font-weight:500;}
  .li .lt span{display:block;font-size:var(--fs-micro);color:var(--text-2);}
  .li > svg{color:var(--text-2);}
  .li .det-ic{width:30px;height:30px;}

  /* ===== the chat (the minecraft_map card) ===== */
  .chat{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);}
  .chat .bar{height:56px;display:flex;align-items:center;gap:6px;padding:0 12px 0 4px;border-bottom:1px solid var(--border);flex:none;}
  .chat .bar .ttl{font-size:var(--fs-title);font-weight:500;}
  .chat .bar .back{appearance:none;background:none;border:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--text-2);}
  .msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
  .you{align-self:flex-end;background:var(--surface-2);border-radius:16px;padding:9px 13px;font-size:var(--fs-body);max-width:80%;}
  .dave{font-size:var(--fs-body);line-height:1.5;}
  .tv{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;}
  .tv-h{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;font-size:var(--fs-secondary);}
  .tv-h svg{color:var(--text-2);}
  .tv-h .s{color:var(--text-2);font-size:var(--fs-micro);}
  .tv-h .fab{margin-left:auto;border:0;background:none;}
  .tv-map{position:relative;height:220px;}
  .tv-map canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;}
  .tv-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{appearance:none;position:relative;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:var(--fs-micro);font-weight:500;}
  .chip::after{content:"";position:absolute;inset:-4px 0;}
  .chip[aria-pressed="true"]{background:var(--steel-tint);border-color:transparent;color:var(--steel-text);}
  /* ===== added for the layers round (places, villagers & pets, beds) ===== */
  .panel{max-height:calc(100% - 200px);}
  .det{overflow:auto;min-height:0;}
  .ln{display:flex;align-items:flex-start;gap:8px;font-size:var(--fs-secondary);color:var(--text-2);line-height:1.4;}
  .ln > svg{width:16px;height:16px;margin-top:2px;color:var(--text-2);}
  .ln b{color:var(--text);font-weight:500;}
  .ln.ok > svg{color:var(--ok-text);} .ln.gate > svg{color:var(--violet-text);} .ln.warn > svg{color:var(--warn-text);}
  .ln.micro{font-size:var(--fs-micro);}
  .state.pt{color:var(--steel-text);background:var(--steel-tint);}
  .state.lock{color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);}
  .det-ic.neu{background:var(--surface-2);color:var(--text);border-color:var(--border);}
  .det-ic.rose{background:rgba(207,138,143,.13);color:var(--rose);}
  .trades{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-input);overflow:hidden;}
  .tr{display:flex;align-items:center;gap:10px;padding:8px 10px;}
  .tr + .tr{border-top:1px solid var(--border);}
  .tr .tl{flex:1;min-width:0;font-size:var(--fs-secondary);}
  .tr .tl small{display:block;color:var(--text-2);font-size:var(--fs-micro);}
  .tr .tu{font-size:var(--fs-micro);color:var(--text-2);white-space:nowrap;text-align:right;}
  .tr.gone .tu{color:var(--warn-text);}
  .tr.hit{background:var(--steel-tint);}
  .tier{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);padding:6px 10px 0;}
  .floatchips{position:absolute;left:12px;right:64px;top:66px;z-index:5;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0;}
  .floatchips::-webkit-scrollbar{display:none;}
  .chip{min-width:44px;}
  .btnrow{flex-wrap:wrap;} .btn{white-space:nowrap;}
  .panel.tall{max-height:52%;}
  .floatchips .chip{background:var(--surface);flex:none;color:var(--text);}
  .floatchips .chip[aria-pressed="true"]{background:var(--steel-tint);background-color:color-mix(in srgb, var(--steel) 22%, var(--surface));color:var(--steel-text);}
  .wpill{position:absolute;left:12px;top:66px;z-index:5;appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:var(--r-input);background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:var(--fs-secondary);font-weight:500;white-space:nowrap;}
  .wpill svg{width:16px;height:16px;color:var(--text-2);}
  .wpill .pd,.chip .pd{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:2px;vertical-align:-1px;}
  .ly-chips{margin:-2px 0 8px 40px;}
  .find{display:flex;flex-direction:column;gap:8px;}
  .find .fl{font-size:var(--fs-micro);color:var(--text-2);}
  .rk{width:30px;height:30px;flex:none;border-radius:999px;background:var(--map-halo);color:var(--map-ink);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .li .lt .r{float:right;color:var(--text-2);font-size:var(--fs-micro);margin-left:8px;}
  .grp{font-size:var(--fs-micro);color:var(--text-2);padding:10px 0 2px;display:flex;align-items:center;gap:6px;}
  .grp .pd{display:inline-block;width:10px;height:10px;border-radius:999px;}
  .asof{font-size:var(--fs-micro);color:var(--text-2);}
</style>
</head>
<body>
<div class="caption"><b>Villagers & pets B — every villager by its job</b> — each villager is a small disc with its job’s glyph, merged into count badges under 40 px; filter chips float on the map. Reviewer chrome (the dashed strip) is not design. States open by hash, e.g. <span style="font-family:var(--font-mono)">#view=villager&amp;theme=light</span>.</div>
<div class="sim" id="sim"></div>
<div class="phone" id="phone"></div>
<script>
const SEC = "mobs", V = "b";
const I = {
  back:'<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  chev:'<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  users:'<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  layers:'<svg viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',

function gateLine(ctx, view, g){

// the goal-chest reach round a tapped place: 48 blocks across, a hairline circle in its owner's colour

// "respawned here": a curved line from a death to where its player came back (a jump, not a path)
function jump(ctx, view, d, to, col){
  const [ax, ay] = toS(view, d.x, d.z), [bx, by] = toS(view, to.x, to.z);

/* ---- section markers ---- */
function placePin(ctx, x, y, p){
  if (V === "b" && SEC === "places") { disc(ctx, x, y, NEUTRAL); glyph(ctx, x, y, "pin", 14);
    ctx.save(); ctx.beginPath(); ctx.arc(x + 9, y + 9, 5.5, 0, 7); ctx.fillStyle = T.halo; ctx.fill(); ctx.beginPath(); ctx.arc(x + 9, y + 9, 4, 0, 7); ctx.fillStyle = pc(p.by); ctx.fill(); ctx.restore(); return; }

}
function bedMark(ctx, x, y, b){ tile(ctx, x, y, pc(b.by)); glyph(ctx, x, y, b.kind === "bed" ? "bed" : "anchor", 15); }
function villagerMark(ctx, x, y, v, small){
  const r = small ? 10 : 11;
  disc(ctx, x, y, NEUTRAL, r); glyph(ctx, x, y, JOB[v.job][0], small ? 11 : 12);

function petMark(ctx, x, y, p){ tile(ctx, x, y, pc(p.by)); glyph(ctx, x, y, "paw", 14); }

  ctx.beginPath(); ctx.arc(x, y, 10, 0, 7); ctx.strokeStyle = col || T.steel; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = T.ink; ctx.font = "700 12px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(String(k), x, y + .5);

/* ---- the label rule (DESIGN "Markers", extended in §M26) ---- */
let BOXES = [], SEGS = [], CHROME = [];
const boxHit = (lx, ly, w, b) => lx < b[2] && lx + w > b[0] && ly - 10 < b[3] && ly + 10 > b[1];
function segHit(lx, ly, w, s){
  const k = Math.ceil(Math.hypot(s[2] - s[0], s[3] - s[1]) / 3);
  for (let i = 0; i <= k; i++) { const px = s[0] + (s[2] - s[0]) * i / k, py = s[1] + (s[3] - s[1]) * i / k; if (px > lx - 2 && px < lx + w + 2 && py > ly - 12 && py < ly + 12) return true; }
  return false;
}
let DROPPED = [], UNDER = [], UNDERB = 0;
function label(ctx, txt, x, y, own, r){
  r = r || 12;
  ctx.save(); ctx.font = "500 12px system-ui, sans-serif";
  const w = ctx.measureText(txt).width + 12, cw = ctx.canvas.width / (devicePixelRatio || 1);
  // right of the marker, else left, else below, else above; else dropped, never drawn under or over anything
  const cands = [[x + r + 5, y], [x - r - 5 - w, y], [x - w / 2, y + r + 13], [x - w / 2, y - r - 13]];
  const fits = ([lx, ly]) => lx >= 6 && lx + w <= cw - 6 && ly > 12
    && !CHROME.some((c) => boxHit(lx, ly, w, c))
    && !BOXES.some((b) => b[4] !== own && boxHit(lx, ly, w, b))
    && !SEGS.some((sg) => sg[4] !== own && segHit(lx, ly, w, sg));
  const at = cands.find(fits);
  if (!at) { DROPPED.push(txt); ctx.restore(); return false; }
  BOXES.push([at[0], at[1] - 10, at[0] + w, at[1] + 10, "label"]);
  ctx.fillStyle = T.plate; ctx.beginPath(); ctx.roundRect(at[0], at[1] - 10, w, 20, 6); ctx.fill();
  ctx.fillStyle = T.text; ctx.textBaseline = "middle"; ctx.fillText(txt, at[0] + 6, at[1] + .5);
  ctx.restore();
  return true;
}
const toS = (v, x, z) => [v.mx + (x - v.cx) * v.k, v.my + (z - v.cz) * v.k];
let SECMODE = false;
const box = (x, y, r, own) => BOXES.push([x - r, y - r, x + r, y + r, own || "m", SECMODE]);
// clustering: markers closer than 40 px merge into a count badge (key: who may merge with whom)
function cluster(items, r, key){
  const out = [];
  for (const it of items) {
    const c = out.find((o) => (!key || o.key === key(it)) && Math.hypot(o.sx - it.sx, o.sy - it.sy) < r);
    if (c) { c.m.push(it); c.sx = c.m.reduce((a, q) => a + q.sx, 0) / c.m.length; c.sy = c.m.reduce((a, q) => a + q.sy, 0) / c.m.length; }
    else out.push({sx:it.sx, sy:it.sy, m:[it], key:key ? key(it) : null});
  }
  return out;
}

/* ---- what this mock draws ---- */
function drawAll(ctx, view, st){
  BOXES = []; SEGS = []; DROPPED = [];
  const P2 = (o) => toS(view, o.x, o.z);
  const labels = []; // [priority, text, x, y, own, r]
  // 1. areas and gate lines (§M26), always drawn while their layers are on
  for (const b of BEACONS) protArea(ctx, view, b);
  for (const g of GATES) if (g.open && g.to.dim === "overworld") gateLine(ctx, view, g);
  // 2. this section's lines and areas
  if (SEC === "places" && st.sel && st.sel.type === "place") reach(ctx, view, st.sel.p);
  if (SEC === "beds") {
    const showFor = (d) => st.sel && ((st.sel.type === "death" && st.sel.d === d) || (st.sel.type === "bed" && d.by === st.sel.b.by && d.re.bed));
    for (const d of DEATHS) if (showFor(d)) { const b = BEDS.find((q) => q.by === d.by); jump(ctx, view, d, d.re.bed ? b : SPAWN, pc(d.by)); }
    if (st.sel && st.sel.type === "death") st.ring = toS(view, st.sel.d.x, st.sel.d.z);
    if (st.sel && st.sel.type === "player") st.ring = toS(view, P[st.sel.by].x, P[st.sel.by].z);
  }
  // 3. the base tiles: structures, beacons, gates (as shipped), spawn and deaths
  const villageMerged = SEC === "mobs" && ((V === "a" && st.mobs.villagers && !st.zoomed) || (V === "b" && view.k < 3));
  for (const s of STRUCTS) { if (villageMerged) continue; const [x, y] = P2(s); tile(ctx, x, y, T.amber); glyph(ctx, x, y, "house", 15); box(x, y, 12); labels.push([5, s.label, x, y, "s"]); }
  for (const b of BEACONS) { const [x, y] = P2(b); tile(ctx, x, y, T.green); glyph(ctx, x, y, "shield", 15); box(x, y, 12); }
  for (const g of GATES) { const [x, y] = P2(g); tile(ctx, x, y, T.violet, !g.open); glyph(ctx, x, y, ["portal", "swirl"], 15, g.open ? T.violet : null); box(x, y, 12, "g" + g.id); }
  // where gate 1 leads: with Saved places on, that pin IS the saved place (README "Same in every variant")
  const placesOn = SEC === "places" && st.placesOn;
  for (const g of GATES) if (g.open && g.to.dim === "overworld" && !placesOn) { const [x, y] = P2(g.to); disc(ctx, x, y, T.violet); glyph(ctx, x, y, "pin", 14); box(x, y, 12, "g" + g.id); labels.push([6, g.to.place, x, y, "g" + g.id]); }
  { const [x, y] = P2(SPAWN); star(ctx, x, y); box(x, y, 11); labels.push([4, "Spawn", x, y, "sp", 11]); }
  for (const d of DEATHS) { const [x, y] = P2(d); skull(ctx, x, y); box(x, y, 11); }
  // 4. the section's own markers
  SECMODE = true;
  if (SEC === "places" && placesOn) drawPlaces(ctx, view, st, labels);
  if (SEC === "mobs") drawMobs(ctx, view, st, labels);
  if (SEC === "beds") drawBeds(ctx, view, st, labels);
  SECMODE = false;
  // 5. the selection ring, then players on top
  if (st.ring) ring(ctx, st.ring[0], st.ring[1], 18);
  for (const p of PLAYERS) { const [x, y] = P2(p); playerDisc(ctx, x, y, p); box(x, y, 12, "p"); }
  // 6. labels: the tapped thing, players, then by rank
  if (st.selLabel) label(ctx, st.selLabel[0], st.selLabel[1], st.selLabel[2], st.selLabel[3], st.selLabel[4]);
  for (const p of PLAYERS) { const [x, y] = P2(p); label(ctx, p.n, x, y, "p"); }
  labels.sort((a, b) => a[0] - b[0]);
  for (const l of labels) label(ctx, l[1], l[2], l[3], l[4], l[5]);
  // reviewer check: no marker under a floating control
  const cvh = ctx.canvas.height / (devicePixelRatio || 1);
  UNDER = []; UNDERB = 0;
  const cw = ctx.canvas.width / (devicePixelRatio || 1);
  const under = (b) => CHROME.slice(0, CHROME.length - 1).some((r) => b[0] < r[2] && b[2] > r[0] && b[1] < r[3] && b[3] > r[1]);
  // the audit: none of this round's markers (places, villagers, pets, beds) and no tapped thing under a control
  if (st.ring) BOXES.push([st.ring[0] - 12, st.ring[1] - 12, st.ring[0] + 12, st.ring[1] + 12, "tapped", true]);
  for (const b of BOXES) if (b[4] !== "label" && (b[0] + b[2]) / 2 > 0 && (b[0] + b[2]) / 2 < cw && (b[1] + b[3]) / 2 > 0 && (b[1] + b[3]) / 2 < cvh && under(b)) { if (b[5]) UNDER.push(b); else UNDERB++; }
}

function drawPlaces(ctx, view, st, labels){
  const list = (st.many ? MANY : PLACES).filter((p) => !p.dim && (!st.whose || p.by === st.whose));
  const items = list.map((p) => { const [sx, sy] = toS(view, p.x, p.z); return {p, sx, sy}; });
  const selP = st.sel && st.sel.type === "place" ? st.sel.p : null;
  // B merges only one player's places (a badge in their colour); A and C merge pins with pins
  const cl = cluster(items.filter((i) => i.p !== selP), 40, V === "b" ? (i) => i.p.by : null);
  if (selP) cl.push({sx:toS(view, selP.x, selP.z)[0], sy:toS(view, selP.x, selP.z)[1], m:[{p:selP}]});
  const labelled = (p) => V === "a" ? true : V === "b" ? view.k >= 2 || p === selP : (!!st.whose || p === selP);
  for (const c of cl) {
    if (c.m.length > 1) {
      const by = c.m[0].p.by, one = c.m.every((q) => q.p.by === by);
      badge(ctx, c.sx, c.sy, c.m.length, V === "b" || (one && V !== "a") ? pc(by) : null); box(c.sx, c.sy, 16);
      continue;
    }
    const p = c.m[0].p; placePin(ctx, c.sx, c.sy, p); box(c.sx, c.sy, 12, p.gate ? "g" + p.gate : "pl");
    if (p === selP) { st.ring = [c.sx, c.sy]; st.selLabel = [p.n, c.sx, c.sy, p.gate ? "g" + p.gate : "pl"]; }
    else if (labelled(p)) labels.push([2, p.n, c.sx, c.sy, p.gate ? "g" + p.gate : "pl"]);
  }
}

function villagersShown(st){
  return VILLAGERS.filter((v) => !st.filter || (st.filter === "librarian" ? v.job === "librarian" : st.filter === "mending" ? v.mending : false));
}
function drawMobs(ctx, view, st, labels){
  const sel = st.sel;
  if (V === "c") {
    // C: nothing until asked; the query's matches, numbered by distance
    st.results.forEach((r, i) => {
      const [x, y] = toS(view, r.x, r.z);
      if (r.pet) petMark(ctx, x, y, r); else rankMark(ctx, x, y, i + 1);
      box(x, y, 12, "r" + i);
      if (sel && sel.o === r) { st.ring = [x, y]; st.selLabel = [`${i + 1} · ${r.lab}`, x, y, "r" + i]; }
      else labels.push([1, `${i + 1} · ${r.lab}`, x, y, "r" + i]);
    });
    return;
  }
  if (st.mobs.villagers) {
    const shown = villagersShown(st);
    if (V === "a" && !st.zoomed) {
      // A: a village is one tile; the located village keeps its amber tile and gains the count
      for (const vg of [1, 2]) {
        const vs = shown.filter((v) => v.v === vg); if (!vs.length) continue;
        const cx = vg === 1 ? STRUCTS[0].x : Math.round(vs.reduce((a, v) => a + v.x, 0) / vs.length), cz = vg === 1 ? STRUCTS[0].z : Math.round(vs.reduce((a, v) => a + v.z, 0) / vs.length);
        const [x, y] = toS(view, cx, cz);
        villageTile(ctx, x, y, vg === 1); box(x, y, 12, "v" + vg);
        const cb = corner(ctx, x, y, String(vs.length)); BOXES.push([...cb, "v" + vg]);
        const word = st.filter === "librarian" ? (vs.length === 1 ? "librarian" : "librarians") : st.filter === "mending" ? "sell Mending" : "villagers";
        labels.push([1, vg === 1 ? `Village · ${vs.length} ${word}` : `${vs.length} ${word}`, x, y, "v" + vg, 12]);
      }
    } else {
      const items = shown.map((v) => { const [sx, sy] = toS(view, v.x, v.z); return {v, sx, sy}; });
      // B, zoomed out: the located village is a point marker like any other, so it merges into the count
      if (V === "b" && view.k < 3) for (const s of STRUCTS) { const [sx, sy] = toS(view, s.x, s.z); items.unshift({s, sx, sy}); }
      const r = view.k >= 3 ? 22 : 40;
      const selV = sel && sel.type === "villager" ? sel.o : null;
      for (const c of cluster(items.filter((i) => i.v !== selV), r)) {
        if (c.m.length > 1) { badge(ctx, c.sx, c.sy, c.m.length); box(c.sx, c.sy, 16); continue; }
        if (c.m[0].s) { tile(ctx, c.sx, c.sy, T.amber); glyph(ctx, c.sx, c.sy, "house", 15); box(c.sx, c.sy, 12); labels.push([5, "Village", c.sx, c.sy, "s"]); continue; }
        const v = c.m[0].v; villagerMark(ctx, c.sx, c.sy, v, view.k >= 3); box(c.sx, c.sy, 11, "vv");
        if (st.filter) labels.push([1, `${v.job[0].toUpperCase() + v.job.slice(1)} · ${LEVEL[v.lvl]}`, c.sx, c.sy, "vv", 11]);
      }
      if (selV) { const [x, y] = toS(view, selV.x, selV.z); villagerMark(ctx, x, y, selV, view.k >= 3); st.ring = [x, y]; st.selLabel = ["Librarian · Expert", x, y, "vv", 11]; }
    }
  }
  if (st.mobs.pets) {
    for (const p of PETS) {
      if (V === "b" && st.filter && st.filter !== "pets") continue; // B's chips pick one kind; A's filter only the villagers
      const [x, y] = toS(view, p.x, p.z); petMark(ctx, x, y, p); box(x, y, 12, "pet");
      if (sel && sel.o === p) { st.ring = [x, y]; st.selLabel = [p.n, x, y, "pet"]; } else labels.push([3, p.n, x, y, "pet"]);
    }
    for (const m of NAMED) {
      if (V === "b" && st.filter && st.filter !== "pets") continue; // B's chips pick one kind; A's filter only the villagers
      const [x, y] = toS(view, m.x, m.z); namedMark(ctx, x, y); box(x, y, 12, "nm"); labels.push([3, m.n, x, y, "nm"]);
    }
  }
}

function drawBeds(ctx, view, st, labels){
  const sel = st.sel;
  for (const b of BEDS) {
    if (b.dim !== "overworld") continue;
    const show = V === "a" || (sel && sel.by === b.by);
    if (!show) continue;
    const [x, y] = toS(view, b.x, b.z); bedMark(ctx, x, y, b); box(x, y, 12, "bed");
    if (sel && sel.type === "bed" && sel.b === b) { st.ring = [x, y]; st.selLabel = [`${b.by}'s bed`, x, y, "bed"]; }
    else labels.push([2, V === "a" ? `${b.by}'s bed` : "Bed", x, y, "bed"]);
  }
}

/* ---- the panel ---- */
function head(){
  return `<div class="grip"></div><div class="head"><button class="world" aria-label="World: Castle Hill — change">Castle Hill ${I.down}</button>
  <div class="seg tabs" role="tablist" aria-label="Panel"><button role="tab" aria-selected="true">${I.layers}Layers</button><button role="tab" aria-selected="false">${I.clock}Timeline</button></div></div>`;
}
const STAT = `<div class="stat"><span class="dot"></span><span><b>Live · 2 on</b>Up to a minute behind the world · positions live</span></div>`;

const ln = (g, html, cls) => `<div class="ln ${cls || ""}">${g}<span>${html}</span></div>`;

function placeDet(p){
  const who = P[p.by], b = covered(p), gap = dist(who, p);
  const lines = [];
  lines.push(b ? ln(I.shield, `<b>Protected</b> · by ${b.by === p.by ? "their" : b.by + "'s"} No-Spawn Beacon at X&nbsp;${n(b.x)} · Z&nbsp;${n(b.z)}`, "ok")
               : ln(I.shield, "Not protected · no No-Spawn Beacon covers it"));
  lines.push(ln(I.user, `${p.by} is ${gap}&nbsp;blocks ${compass(p, who)} of it · ${who.on ? "online" : "offline, where they logged off"}`));
  if (p.gate) { const g = GATES.find((q) => q.id === p.gate); lines.push(ln(I.portal, `Wormhole gate&nbsp;${g.id} leads here, from X&nbsp;${n(g.x)} · Z&nbsp;${n(g.z)}`, "gate")); }
  lines.push(ln(I.target, p.goal ? `<b>Goals count chests within 48&nbsp;blocks</b> (the circle) · 9 of 23 iron blocks toward <i>${p.goal.name}</i>` : "<b>Goals count chests within 48&nbsp;blocks</b> (the circle) · none here yet"));
  const btns = `<div class="btnrow"><button class="btn primary">${I.crosshair}Point ${p.by}'s Tricorder here</button></div>`;
  return det(pic(p.by, I.pin), p.n, `${p.by}'s saved place · saved ${nb(p.at)} · in the Overworld`, XYZ(p, true), lines.join("") + btns);
}

/* ---- the states ---- */
function state(){
  const st = {sel:null, ring:null, selLabel:null, placesOn:true, many:false, whose:null, mobs:{villagers:true, pets:true}, filter:null, zoomed:false, results:[]};
  const v = S.view;
  if (SEC === "places") {
    if (v === "place") st.sel = {type:"place", p:PLACES[0]};
    if (v === "farm") st.sel = {type:"place", p:PLACES[1]};
    if (v === "many") { st.many = true; if (V === "c") st.whose = "BlockyFox"; }
  }
  if (SEC === "mobs") {
    if (v === "villager") { st.sel = {type:"villager", o:VILLAGERS[0]}; st.zoomed = true; }
    if (v === "pet") st.sel = {type:"pet", o:PETS[0]};
    if (v === "filter") st.filter = V === "c" ? "pets" : "librarian";
    if (V === "c") {
      // the asked-for matches, nearest BlockyFox first
      const me = PLAYERS[0];
      if (v === "filter" || v === "pet") st.results = PETS.filter((p) => p.by === "BlockyFox" || p.by === "Mira_P").map((p) => ({...p, pet:true, lab:`${p.n} · ${p.kind}`, src:p}));
      else st.results = VILLAGERS.filter((q) => q.mending).map((q) => ({...q, lab:`Mending · ${LEVEL[q.lvl]}`, src:q}));
      st.results.sort((a, b) => dist(me, a) - dist(me, b));
      if (v === "villager") st.sel = {type:"villager", o:st.results[0]};
      if (v === "pet") st.sel = {type:"pet", o:st.results.find((r) => r.n === "Rex")};
    }
  }
  if (SEC === "beds") {
    if (v === "player") st.sel = {type:"player", by:"BlockyFox"};
    if (v === "bed") st.sel = {type:"bed", b:BEDS[0], by:"BlockyFox"};
    if (v === "death") st.sel = {type:"death", d:DEATHS[0], by:"BlockyFox"};
    if (v === "death2") st.sel = {type:"death", d:DEATHS[1], by:"Steve42"};
  }
  return st;
}
function camera(st, W, mapH){
  const k = W < 360 ? 1.0 : 1.25;
  let v = {k, cx:-30, cz:-30, mx:W / 2, my:mapH / 2 + 30};
  const at = (k2, cx, cz, dy) => ({k:k2, cx, cz, mx:W / 2, my:mapH / 2 + (dy || 26)});
  const s = S.view;
  if (SEC === "places") {
    if (s === "place") v = at(W < 360 ? 2 : 2.4, 66, 6);
    if (s === "farm") v = at(W < 360 ? 1.4 : 1.7, -100, -90);
    if (s === "many") v = at(W < 360 ? 1.5 : 1.8, 60, -4);
    if (s === "layers") v = at(1.25, -40, -60);
  }
  if (SEC === "mobs") {
    if (s === "map" && V === "c") v = at(W < 360 ? 2 : 2.4, -132, -116); // framed on the matches
    if (s === "villager") v = at(W < 360 ? 3.6 : 4.4, -126, -114);
    if (s === "pet") v = at(2.4, 50, 34);
    if (s === "filter") v = V === "c" ? at(1.6, 34, -10) : V === "b" ? at(W < 360 ? 2.6 : 3, -128, -114) : at(1.25, -30, -30);
    if (s === "layers") v = at(1.25, -40, -60);
  }
  if (SEC === "beds") {
    if (s === "player" || s === "bed") v = at(W < 360 ? 2 : 2.4, 58, 30);
    if (s === "death") v = at(W < 360 ? .95 : 1.15, 8, 90, 10);
    if (s === "death2") v = at(W < 360 ? 1.2 : 1.4, -30, -110);
    if (s === "layers") v = at(1.25, -20, -40);
  }
  return v;
}

  if (fr) CHROME.splice(2, 0, [fr.left - pr.left - 4, fr.top - pr.top - 2, fr.right - pr.left + 4, fr.bottom - pr.top + 2]);
  // the camera keeps every marker clear of the floating controls: a dry run of the markers (no terrain)

  const base = camera(st, W, mapH);
  const dry = document.createElement("canvas"); dry.width = W * dpr; dry.height = H * dpr;
  const dctx = dry.getContext("2d"); dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let best = null;
  for (const kf of [1, .94, 1.06, .88, 1.12, .8, 1.25, .7, 1.4]) for (let i = -6; i <= 6; i++) for (let j = -6; j <= 6; j++) {
    const v2 = {...base, k:base.k * kf, cx:base.cx + i * 10 / base.k, cz:base.cz + j * 10 / base.k};
    const s2 = state(); drawAll(dctx, v2, s2);
    let cost = UNDER.length * 1000 + UNDERB * 60 + DROPPED.length * 12 + (Math.abs(i) + Math.abs(j)) * 4 + Math.abs(1 - kf) * 150;
    if (s2.ring) { const [rx, ry] = s2.ring; if (rx < 40 || rx > W - 40 || ry < 90 || ry > mapH - 30) cost += 500; }
    if (!best || cost < best.cost) best = {cost, v:v2};
  }
  const v = best.v;
  ph.querySelector(".scale span").textContent = `${Math.round(40 / v.k)} blocks · N↑`;
  drawTerrain(ctx, W, H, v, dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawAll(ctx, v, st);
  for (const b of UNDER) console.warn("marker under a control at " + b.slice(0, 2).map(Math.round).join(",") + " (" + b[4] + ")");
  drawSwatches();
  window.__dropped = DROPPED.slice();
}

function drawSwatches(){
  for (const c of document.querySelectorAll("canvas[data-sw]")) {
    const ctx = c.getContext("2d"); ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.fillStyle = css("--map-void"); ctx.beginPath(); ctx.roundRect(0, 0, 22, 22, 5); ctx.fill();
    const k = c.dataset.sw;
    ctx.save(); ctx.translate(11, 11); ctx.scale(.78, .78); ctx.translate(-11, -11);
    if (k === "pinA") { disc(ctx, 11, 11, T.steel); glyph(ctx, 11, 11, "pin", 14); }
    if (k === "pinB") { const keep = V; placePin(ctx, 11, 11, {by:"BlockyFox"}); }
    if (k.startsWith("badge")) badge(ctx, 11, 11, 4, k === "badgeb" ? T.steel : null);
    if (k === "village") { villageTile(ctx, 11, 11, true); }
    if (k === "villager") { villagerMark(ctx, 11, 11, {job:"librarian"}); }
    if (k.startsWith("g-")) { disc(ctx, 11, 11, NEUTRAL, 11); glyph(ctx, 11, 11, k.slice(2), 12); }
    if (k === "pet") petMark(ctx, 11, 11, {by:"Mira_P"});
    if (k === "named") namedMark(ctx, 11, 11);
    if (k === "rank") rankMark(ctx, 11, 11, 1);
    if (k === "spawn") star(ctx, 11, 11);
    if (k === "bed") bedMark(ctx, 11, 11, {by:"BlockyFox", kind:"bed"});
    if (k === "anchor") bedMark(ctx, 11, 11, {by:"Mira_P", kind:"anchor"});
    ctx.restore();
    if (k === "reach") { ctx.beginPath(); ctx.arc(11, 11, 8, 0, 7); ctx.fillStyle = "rgba(127,167,201,.18)"; ctx.fill(); ctx.strokeStyle = T.steel; ctx.lineWidth = 1.5; ctx.stroke(); }
    if (k === "jump") { ctx.lineCap = "round"; ctx.strokeStyle = T.steel; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(3, 18); ctx.quadraticCurveTo(4, 4, 18, 5); ctx.stroke(); ctx.beginPath(); ctx.moveTo(13, 2); ctx.lineTo(18, 5); ctx.lineTo(14, 9); ctx.stroke(); }
  }
}

const VIEWS = {
  places:[["map","Map"],["place","Tap Home"],["farm","Tap Tree farm"],["many","A busy base"],["layers","Layers tab"]],
  mobs:[["map","Map"],["villager","Tap a librarian"],["pet","Tap a pet"],["filter", V === "c" ? "Find: pets" : "Librarians only"],["layers","Layers tab"]],
  beds:[["map","Map"],["player","Tap BlockyFox"],["bed","Tap the bed"],["death","Tap a death"],["death2","Death, no bed"],["layers","Layers tab"]],
}[SEC];
function render(){
  readHash(); readT();
  mapScreen();
  const opt = (k, vals) => `<div class="srow"><span class="sl">${k}</span>${vals.map(([v, l]) => `<button aria-pressed="${S[k] === v}" data-k="${k}" data-v="${v}">${l}</button>`).join("")}</div>`;
  document.getElementById("sim").innerHTML = `<div class="stitle">Mock controls</div>` + opt("view", VIEWS) + opt("theme", [["","System"],["dark","Dark"],["light","Light"]]);
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  const o = {...S, [b.dataset.k]: b.dataset.v}; delete o.shot;
  location.hash = Object.entries(o).filter(([k, v]) => v !== DEF[k]).map(([k, v]) => `${k}=${v}`).join("&");
});
addEventListener("hashchange", render);
addEventListener("resize", render);
render();
</script>
