<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Minecraft goals in the app · B — goals in the player's sheet</title>
<!-- GUI gate mock — docs/mocks/minecraft-goals/README.md. Spec: docs/plans/MINECRAFT_BEDROCK_PLAN.md §M24 ("Goals that
     count") and "Goals and the progress log" (app.mc_goals, app.mc_goal_log, mc_goal_progress). Built on the binding
     Minecraft screen (docs/mocks/minecraft-ops/b-dedicated-screen.html, shipped as frontend/src/screens/MinecraftScreen.tsx:
     the section heads, cards, the Players table and its bottom Sheet) and, for C, the binding map
     (docs/mocks/minecraft-map/a-full-bleed.html). Self-contained and offline; tokens per docs/reference/DESIGN.md. -->
<style>
  :root{
    color-scheme:dark;
    --bg:#0E0F11; --surface:#17181B; --surface-2:#1E2024; --border:#26282C;
    --text:#E6E7E9; --text-2:#9A9DA3; --text-3:#5C5F66;
    --scrim:rgba(14,15,17,.6);
    --steel:#7FA7C9; --green:#8FBC9A; --amber:#C9A36A; --rose:#CF8A8F; --violet:#A493C9;
    --steel-tint:rgba(127,167,201,.13); --green-tint:rgba(143,188,154,.13); --amber-tint:rgba(201,163,106,.13); --violet-tint:rgba(164,147,201,.13);
    --ok:var(--green);
    --r-input:12px; --r-card:16px; --r-pill:999px;
    --fs-micro:12px; --fs-head:13px; --fs-secondary:14px; --fs-body:16px; --fs-title:18px; --fs-screen:22px;
    --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --shadow-card:none;
    --ok-text:var(--green); --warn-text:var(--amber); --steel-text:var(--steel); --violet-text:var(--violet);
    --map-void:#141518; --map-halo:rgba(8,9,11,.9); --map-plate:rgba(23,24,27,.9); --map-ink:#f2f2f2; --map-ink-on:#0e0f11;
    --frame:#2A2C30; --page:#000;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  [data-theme="light"]{
    color-scheme:light;
    --bg:#F7F7F5; --surface:#FFFFFF; --surface-2:#F0F0EE; --border:#E2E2DF;
    --text:#1A1B1E; --text-2:#5C5F66; --text-3:#9A9DA3;
    --scrim:rgba(247,247,245,.6); --shadow-card:0 1px 2px rgba(0,0,0,.06);
    --ok-text:color-mix(in srgb, var(--green) 46%, var(--text));
    --warn-text:color-mix(in srgb, var(--amber) 50%, var(--text));
    --steel-text:color-mix(in srgb, var(--steel) 52%, var(--text));
    --violet-text:color-mix(in srgb, var(--violet) 52%, var(--text));
    --map-void:#1e2024; --map-halo:rgba(8,9,11,.85); --map-plate:rgba(255,255,255,.92);
    --frame:#C9C9C4; --page:#DADAD6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--page);color:var(--text);display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0 40px;min-height:100vh;line-height:1.4;}
  svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;width:18px;height:18px;}
  button{font:inherit;color:inherit;cursor:pointer;text-align:left;}
  :focus-visible{outline:2px solid var(--steel);outline-offset:2px;}
  .num{font-variant-numeric:tabular-nums;}

  /* reviewer chrome — OUTSIDE the design */
  .caption{max-width:390px;width:100%;padding:0 16px;color:var(--text-2);font-size:13px;line-height:1.55;}
  .caption b{color:var(--text);font-weight:500;}
  .sim{max-width:390px;width:calc(100% - 32px);padding:10px 12px;border:1px dashed var(--text-3);border-radius:14px;display:flex;flex-direction:column;gap:8px;}
  .sim .stitle{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);}
  .sim .srow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .sim .sl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);width:62px;flex:none;}
  .sim button{appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:11.5px;padding:5px 10px;border-radius:999px;}
  .sim button[aria-pressed="true"]{background:var(--steel-tint);border-color:transparent;color:var(--steel-text);font-weight:600;}
  body.shot .caption, body.shot .sim{display:none;}
  body.shot{padding:0;gap:0;}

  .phone{width:390px;height:820px;background:var(--bg);border:1px solid var(--frame);border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
  body.shot .phone{border-radius:0;border:0;width:100vw;height:100vh;}
  @media (max-width:430px){ .phone{width:100%;height:100dvh;border-radius:0;border-left:0;border-right:0;} }

  /* ===== the Minecraft screen ===== */
  .bar{height:56px;display:flex;align-items:center;gap:6px;padding:0 12px 0 4px;border-bottom:1px solid var(--border);flex:none;}
  .bar .back{appearance:none;background:none;border:none;color:var(--text-2);width:44px;height:44px;display:flex;align-items:center;justify-content:center;}
  .bar .ttl{font-size:var(--fs-title);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar .ttl small{display:block;font-size:var(--fs-micro);color:var(--text-2);font-weight:400;}
  .scroll{flex:1;overflow-y:auto;padding:12px 16px 28px;}
  .sect{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);margin:0 2px 8px;display:flex;align-items:baseline;gap:8px;}
  .sect .r{margin-left:auto;text-transform:none;letter-spacing:0;font-size:var(--fs-micro);text-align:right;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);margin-bottom:20px;overflow:hidden;box-shadow:var(--shadow-card);}
  .pad{padding:4px 14px;}
  .note{font-size:var(--fs-micro);color:var(--text-2);line-height:1.45;}
  .pav{width:24px;height:24px;flex:none;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:var(--fs-micro);font-weight:600;color:var(--text-2);}
  .pav.on{background:var(--green-tint);border-color:transparent;color:var(--ok-text);}
  .on-w{color:var(--ok-text);}

  /* the Players table (the shipped .mc-ptable), B adds a goal glance under a row */
  .pth,.ptr{display:grid;grid-template-columns:minmax(0,1fr) 70px 78px 16px;gap:6px;align-items:start;font-size:var(--fs-micro);}
  .pth{padding:10px 0 6px;color:var(--text-2);}
  .pth > :not(:first-child),.ptr > :not(:first-child){text-align:right;font-variant-numeric:tabular-nums;}
  .ptr{position:relative;min-height:48px;padding:9px 0;border-top:1px solid var(--border);}
  .ptr > :last-child{color:var(--text-3);align-self:center;display:flex;}
  .pname{display:flex;align-items:center;gap:8px;min-width:0;}
  .pn{min-width:0;}
  .prow{appearance:none;background:none;border:0;padding:0;font-size:var(--fs-secondary);font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%;}
  .prow::after{content:"";position:absolute;inset:0;}
  .sm{display:block;font-size:var(--fs-micro);color:var(--text-2);}
  .glance{grid-column:1 / -1;display:flex;align-items:center;gap:8px;margin:2px 0 0 32px;font-size:var(--fs-micro);color:var(--text-2);text-align:left !important;min-width:0;}
  .ptr > .glance{color:var(--text-2);align-self:start;}
  .glance .gbar{width:44px;flex:none;}
  .glance span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ===== goals ===== */
  .pgrp{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;font-size:var(--fs-secondary);font-weight:500;}
  .pgrp .sm{display:inline;margin-left:auto;}
  .pgrp + .goal, .goal + .goal, .goal + .fin, .fin + .goal{border-top:1px solid var(--border);}
  .card > .pgrp:not(:first-child){border-top:1px solid var(--border);margin-top:4px;}
  .goal{appearance:none;display:flex;gap:10px;width:100%;min-height:56px;padding:12px 14px;background:none;border:0;color:inherit;align-items:flex-start;}
  .goal.flat{cursor:default;}
  .gic{width:28px;height:28px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);}
  .gic svg{width:16px;height:16px;}
  .gic.count{background:var(--steel-tint);border-color:transparent;color:var(--steel-text);}
  .gic.done{background:var(--green-tint);border-color:transparent;color:var(--ok-text);}
  .gbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .gtop{display:flex;align-items:baseline;gap:8px;}
  .gt{flex:1;min-width:0;font-size:var(--fs-secondary);font-weight:500;overflow-wrap:anywhere;}
  .goal.muted .gt{color:var(--text-2);font-weight:400;}
  .gn{flex:none;font-size:var(--fs-secondary);font-variant-numeric:tabular-nums;color:var(--text);font-weight:500;white-space:nowrap;}
  .gn small{font-size:var(--fs-micro);color:var(--text-2);font-weight:400;}
  .gs{font-size:var(--fs-micro);color:var(--text-2);line-height:1.45;}
  .gs b{color:var(--text);font-weight:500;}
  .gchev{color:var(--text-3);align-self:center;}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-micro);border-radius:999px;padding:1px 8px;white-space:nowrap;font-weight:500;}
  .pill.done{color:var(--ok-text);background:var(--green-tint);}
  .pill.reached{color:var(--ok-text);background:var(--green-tint);}
  .pill.aband{color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);}
  .pill.later{color:var(--warn-text);background:var(--amber-tint);}

  /* the progress bar: carried solid, chests lighter, the rest the track; reached is green;
     a count that can't be made right now is the track, hatched */
  .gbar{position:relative;display:flex;height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;}
  .gbar i{display:block;height:100%;}
  .gbar .c{background:var(--steel);}
  .gbar .h{background:color-mix(in srgb, var(--steel) 45%, transparent);}
  .gbar.reached .c,.gbar.reached .h{background:var(--green);}
  .gbar.unknown{background:repeating-linear-gradient(135deg, var(--surface-2) 0 5px, var(--border) 5px 7px);}
  .key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--fs-micro);color:var(--text-2);}
  .key span{display:inline-flex;align-items:center;gap:6px;}
  .key i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .key .c{background:var(--steel);} .key .h{background:color-mix(in srgb, var(--steel) 45%, transparent);border:1px solid var(--steel);}

  .fin{appearance:none;display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 14px;background:none;border:0;color:var(--text-2);font-size:var(--fs-micro);}
  .fin svg{width:16px;height:16px;margin-left:auto;}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 18px;}
  .empty .eic{width:44px;height:44px;border-radius:999px;background:var(--steel-tint);color:var(--steel-text);display:flex;align-items:center;justify-content:center;}
  .empty b{font-size:var(--fs-body);font-weight:500;}
  .quote{font-style:italic;color:var(--text);}
  .hint{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:var(--fs-micro);color:var(--text-2);line-height:1.45;}
  .hint svg{width:16px;height:16px;color:var(--text-2);margin-top:1px;}

  /* the goal sheet (A and C) and B's opened card */
  .scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;z-index:21;padding:0 16px 16px;max-height:92%;overflow:auto;display:flex;flex-direction:column;}
  .sgrip{width:32px;height:4px;border-radius:999px;background:var(--border);margin:10px auto 12px;flex:none;}
  .sh-h{display:flex;align-items:flex-start;gap:10px;}
  .sh-h h3{flex:1;font-size:var(--fs-title);font-weight:500;}
  .sh-h .sm{margin-top:2px;}
  .x{appearance:none;width:44px;height:44px;margin:-10px -10px 0 0;border:0;background:none;color:var(--text-2);display:flex;align-items:center;justify-content:center;flex:none;}
  .shbody{display:flex;flex-direction:column;gap:14px;margin-top:14px;}
  .big{font-size:var(--fs-screen);font-weight:500;font-variant-numeric:tabular-nums;}
  .big small{font-size:var(--fs-secondary);color:var(--text-2);font-weight:400;margin-left:6px;}
  .gbar.lg{height:12px;}
  .where{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-input);overflow:hidden;}
  .wr{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;}
  .wr + .wr{border-top:1px solid var(--border);}
  .wr .wi{width:28px;height:28px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-2);}
  .wr .wi svg{width:16px;height:16px;}
  .wr .wt{flex:1;min-width:0;font-size:var(--fs-secondary);}
  .wr .wt small{display:block;font-size:var(--fs-micro);color:var(--text-2);line-height:1.4;}
  .wr .wn{font-size:var(--fs-secondary);font-weight:500;font-variant-numeric:tabular-nums;}
  .chip-far{display:inline-flex;font-size:11px;padding:0 6px;border-radius:999px;background:var(--amber-tint);color:var(--warn-text);margin-left:4px;white-space:nowrap;}
  .asof{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .asof .note{flex:1 1 180px;}
  .btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;border-radius:var(--r-input);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-secondary);font-weight:500;white-space:nowrap;}
  .btn.primary{background:var(--steel-tint);border-color:transparent;color:var(--steel-text);}
  .btn.full{width:100%;}
  .log{display:flex;flex-direction:column;}
  .le{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:9px 0;border-top:1px solid var(--border);font-size:var(--fs-secondary);}
  .le:first-child{border-top:0;}
  .le .src{grid-row:1 / 3;width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-2);}
  .le .src svg{width:14px;height:14px;}
  .le small{font-size:var(--fs-micro);color:var(--text-2);}
  .opened{display:flex;flex-direction:column;gap:12px;padding:0 14px 14px 52px;}

  /* ===== C: the map with a Goals tab ===== */
  .map{position:absolute;inset:0;}
  .map canvas{position:absolute;inset:0;width:100%;height:100%;}
  .top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:5;}
  .fab{appearance:none;width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:var(--r-input);background:var(--surface);border:1px solid var(--border);color:var(--text);box-shadow:var(--shadow-card);}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-input);padding:3px;gap:2px;}
  .seg button{appearance:none;flex:1;min-width:0;min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--text-2);font-size:13px;font-weight:500;padding:0 6px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .seg button[aria-selected="true"],.seg button[aria-checked="true"]{background:var(--steel-tint);color:var(--text);}
  .dims{flex:1;max-width:280px;margin-left:auto;background:var(--surface);}
  .scale{position:absolute;left:12px;z-index:5;display:flex;align-items:center;gap:8px;background:var(--map-plate);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--text);}
  .scale i{display:block;width:40px;height:6px;border:1.5px solid var(--text);border-top:0;}
  .panel{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;box-shadow:var(--shadow-card);overflow:hidden;}
  .panel .grip{width:32px;height:4px;margin:7px auto 4px;border-radius:999px;background:var(--border);flex:none;}
  .head{display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;flex:none;}
  .world{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;border:0;background:none;font-size:var(--fs-title);font-weight:500;white-space:nowrap;min-width:0;}
  .world svg{color:var(--text-2);width:16px;height:16px;}
  .tabs{margin-left:auto;flex:none;}
  .tabs button{padding:0 9px;font-size:var(--fs-head);}
  .tabs svg{width:16px;height:16px;}
  /* three tabs and the world don't fit under 400 px with words: the tabs go to their glyphs (named) */
  @media (max-width:400px){ .tabs .tl{display:none;} .tabs button{width:44px;padding:0;} }
  .stat{display:flex;align-items:center;gap:8px;min-height:44px;padding:2px 16px 0;font-size:var(--fs-micro);color:var(--text-2);line-height:1.35;flex:none;}
  .stat .dot{width:8px;height:8px;border-radius:999px;background:var(--ok);box-shadow:0 0 0 3px var(--green-tint);flex:none;}
  .stat b{display:block;color:var(--text);font-weight:500;}
  .pbody{flex:1;overflow:auto;padding:2px 16px 20px;display:flex;flex-direction:column;gap:10px;}
  .pbody > *{flex:none;}
  .who{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .who button{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:var(--fs-micro);font-weight:500;white-space:nowrap;flex:none;}
  .who button[aria-checked="true"]{background:var(--steel-tint);border-color:transparent;color:var(--text);}
  .who .disc{width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--map-ink-on);}
  .who .disc.off{background:transparent !important;border:2px solid currentColor;}
  .gcard{border:1px solid var(--border);border-radius:var(--r-input);background:var(--surface);}
  .gcard.sel{border-color:var(--steel);background:var(--steel-tint);}
  .gcard .goal{padding:10px 12px;}
</style>
</head>
<body>
<div class="caption" id="cap"></div>
<div class="sim" id="sim"></div>
<div class="phone" id="phone"></div>
<script>
const V = "b";
const CAPTION = {
  a:"<b>A — a Goals section on the Minecraft screen</b> — one card under Players, grouped by player, every open goal with its bar; finished goals fold under each player. A goal opens a Sheet with where the count comes from and its journal.",
  b:"<b>B — goals live in the player's sheet</b> — the Players table gains one glance line per player with goals; the player's Sheet gets a Goals section (cards open in place) and their Journal. No new section on the screen.",
  c:"<b>C — a Goals tab on the map</b> — Layers · Timeline · <b>Goals</b>: pick a player, pick a goal, and the map draws the 48-block reach round each saved place whose chests count, with the number in each. The same Sheet opens from a card.",
};
const I = {
  back:'<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  chev:'<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  target:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
  flag:'<svg viewBox="0 0 24 24"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.33 2q2 0 3.67-.8a1 1 0 0 1 1.4.9v9.5a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.5"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  ban:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>',
  pack:'<svg viewBox="0 0 24 24"><path d="M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 10h8M8 18h8M8 22v-6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v6M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>',

const nb = (t) => String(t).replace(/ /g, "&nbsp;");
const P = (n) => PLAYERS.find((p) => p.n === n);

function tally(g){
  if (!g.count) return null;
  const chests = g.count.chests.reduce((s, c) => s + c[1], 0), carried = g.count.carried ?? 0;
  return {have:carried + chests, carried, chests, reached:carried + chests >= g.need};
}
function bar(g, lg){
  const t = tally(g);
  if (g.world || !t) return `<div class="gbar unknown${lg ? " lg" : ""}" role="img" aria-label="Not counted"></div>`;
  const pc = (v) => Math.min(100, v / g.need * 100);
  const c = pc(t.carried), h = Math.min(100 - c, pc(t.chests));
  return `<div class="gbar${t.reached ? " reached" : ""}${lg ? " lg" : ""}" role="img" aria-label="${t.have} of ${g.need}"><i class="c" style="width:${c}%"></i><i class="h" style="width:${h}%"></i></div>`;
}
// the line under a counted goal: where the number comes from, and how old it is
function why(g){
  const p = P(g.who), t = tally(g);
  if (g.world) return `In <b>${g.world}</b>, which isn't the loaded world — counted again when it is.`;
  if (!t) return `No count · made ${nb(g.made)}`;
  const bits = [];
  if (g.count.carried !== null) bits.push(`${t.carried}&nbsp;carried`);
  for (const [name, n] of g.count.chests) if (n) bits.push(`${n}&nbsp;in chests near ${nb(name)}`);
  if (g.count.carried === null) bits.push(`what ${p.n} carries counts while they're on`);
  if (g.count.noplaces) bits.push("no saved places, so no chests");

}

  const t = tally(g);

  return `<span class="gn">${t.have}<small> / ${g.need}</small></span>`;
}

      <span class="gs"><span class="pill ${done ? "done" : "aband"}">${done ? "done" : "abandoned"}</span> ${nb(g.ended)}${g.need ? ` · counted ${g.item} ×${g.need}` : ""}</span></span></div>`;
  }

    <span class="gtop"><span class="gt">${g.title}</span>${count(g)}</span>

}
function finRow(who, open){

}

/* ---- the sheet: one goal, its count taken apart, its journal ---- */
function where(g){
  const p = P(g.who), t = tally(g), rows = [];
  if (g.count.carried !== null) rows.push(`<div class="wr"><span class="wi">${I.pack}</span><span class="wt">On ${p.n}<small>inventory, armour and off-hand${g.count.shulker ? ` · ${g.count.shulker} shulker box not opened` : ""}</small></span><span class="wn">${t.carried}</span></div>`);
  else rows.push(`<div class="wr"><span class="wi">${I.pack}</span><span class="wt">On ${p.n}<small>counted only while they're on — last on ${p.seen.toLowerCase()} at ${nb(p.clock)}</small></span><span class="wn" style="color:var(--text-2)">—</span></div>`);
  for (const [name, n, dist] of g.count.chests) {
    const pl = PLACES[g.who].find((x) => x.name === name);
    const far = pl && pl.far ? `<span class="chip-far">far</span>` : "";
    const sub = pl && pl.far
      ? `${nb(pl.far + " blocks")} from ${p.n}. In game this place costs one of their deep scans; here it's read from the world files, which never does.`
      : `chests within 48&nbsp;blocks${dist !== null ? ` · ${dist}&nbsp;blocks from ${p.n}` : ""}`;
    rows.push(`<div class="wr"><span class="wi">${I.chest}</span><span class="wt">Near ${name}${far}<small>${sub}</small></span><span class="wn">${n}</span></div>`);
  }
  return `<div class="where">${rows.join("")}</div>`;
}

  return `<div class="log">${e.map((l) => `<div class="le"><span class="src" title="${SRC[l.src][1]}">${SRC[l.src][0]}</span><span>${l.t}</span><small>${nb(l.when)} · ${l.src === "game" ? `${l.who}, in game` : SRC[l.src][1]}</small></div>`).join("")}</div>`;
}
function goalInside(g){

function sheet(g){

}

/* ---- A: the section ---- */
function goalsSection(open, empty){
  if (empty) return `<h3 class="sect" id="goals">Goals</h3><div class="card">${emptyCard()}</div>`;
  const groups = ["BlockyFox", "Tink42", "Mira_P"].map((w) => {

    return `<div class="pgrp"><span class="pav${p.on ? " on" : ""}">${w[0]}</span>${w}<span class="sm">${p.on ? `<span class="on-w">on now</span>` : `last on ${p.seen.toLowerCase()}`}</span></div>
      ${mine.map((g) => goalRow(g)).join("")}${finRow(w, open && w === "BlockyFox")}`;
  }).join("");
  return `<h3 class="sect" id="goals">Goals<span class="r">5 open</span></h3><div class="card">${groups}</div>`;
}
function emptyCard(){

/* ---- the screen around it ---- */
function playersTable(glance){
  const rows = PLAYERS.map((p) => {
    const open = GOALS.filter((g) => g.who === p.n && g.status === "open");

      const what = lead.world ? `${lead.title} · not loaded` : t ? (t.reached ? `${lead.title} · reached` : `${t.have}/${lead.need} ${lead.item}`) : lead.title;
      gl = `<div class="glance">${lead.need ? bar(lead) : I.flag}<span>${what}${more ? ` · ${more}&nbsp;more` : ""}</span></div>`;
    }
    return `<div class="ptr"><div class="pname"><span class="pav${p.on ? " on" : ""}">${p.n[0]}</span><span class="pn"><button class="prow">${p.n}</button><span class="sm">since ${nb(p.since)}</span></span></div>
      <div>${p.total}<span class="sm">${p.sessions} sessions</span></div>
      <div>${p.on ? `<span class="on-w">on now</span><span class="sm">${p.seen}</span>` : `${p.seen}<span class="sm">${p.clock}</span>`}</div><div>${I.chev}</div>${gl}</div>`;

}

function playerSheet(who, openId, finOpen){

/* ---- C: the map with the Goals tab ---- */
function hash2(x, z){ let h = (x * 374761393 + z * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi; const s = (t) => t * t * (3 - 2 * t);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return (a + (b - a) * s(xf)) + ((c + (d - c) * s(xf)) - (a + (b - a) * s(xf))) * s(zf);
}
const fbm = (x, z) => 0.55 * vnoise(x / 90, z / 90) + 0.3 * vnoise(x / 34, z / 34) + 0.15 * vnoise(x / 11, z / 11);
function terrain(x, z){

  c = c.map((v) => Math.max(0, Math.min(255, v * shade)));
  const explored = Math.hypot(x - 10, (z + 10) * 1.1) < 190 + 30 * vnoise(x / 40, z / 40);
  if (!explored) { const g = (c[0] + c[1] + c[2]) / 3; c = c.map((v) => (v * 0.5 + g * 0.5) * 0.62); }
  return c;
}
let T = {}, BOXES = [], CHROME = [];
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const toS = (v, x, z) => [v.mx + (x - v.cx) * v.k, v.my + (z - v.cz) * v.k];
function drawTerrain(ctx, W, H, view, dpr){
  const img = ctx.createImageData(W * dpr, H * dpr);
  for (let py = 0; py < H * dpr; py++) { const z = Math.floor(view.cz + (py / dpr - view.my) / view.k);
    for (let px = 0; px < W * dpr; px++) { const x = Math.floor(view.cx + (px / dpr - view.mx) / view.k); const c = terrain(x, z), o = (py * W * dpr + px) * 4;
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255; } }
  ctx.putImageData(img, 0, 0);
}
function plateAt(ctx, txt, cands){
  ctx.save(); ctx.font = "500 12px system-ui, sans-serif";
  const w = ctx.measureText(txt).width + 12, cw = ctx.canvas.width / (devicePixelRatio || 1);
  const hit = (lx, ly, b) => lx < b[2] && lx + w > b[0] && ly - 10 < b[3] && ly + 10 > b[1];
  const at = cands.map((f) => f(w)).find(([lx, ly]) => lx >= 6 && lx + w <= cw - 6 && !CHROME.some((r) => hit(lx, ly, r)) && !BOXES.some((b) => hit(lx, ly, b)));

  ctx.restore();

// The reach a goal counts: 48 blocks round a saved place, all heights (the sidecar's /map/stock).
// Dotted in the player's colour over a halo, so it never reads as a beacon's dashed square.
function reach(ctx, v, pl, col){
  const [x, y] = toS(v, pl.x, pl.z), r = 48 * v.k;
  ctx.save(); ctx.globalAlpha = .12; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  ctx.lineCap = "round"; ctx.setLineDash([2, 5]);

}
function placePin(ctx, x, y, col){
  ctx.save(); ctx.fillStyle = T.halo; ctx.beginPath(); ctx.roundRect(x - 12, y - 12, 24, 24, 7); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x - 10.5, y - 10.5, 21, 21, 6); ctx.stroke();

  ctx.save(); ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fillStyle = T.halo; ctx.fill();
  if (p.on) { ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fillStyle = css(p.tok); ctx.fill(); ctx.fillStyle = T.inkOn; }
  else { ctx.beginPath(); ctx.arc(x, y, 7.5, 0, 7); ctx.strokeStyle = css(p.tok); ctx.lineWidth = 2.5; ctx.stroke(); ctx.fillStyle = css(p.tok); }
  ctx.font = "700 11px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(p.n[0], x, y + .5);
  ctx.restore(); BOXES.push([x - 11, y - 11, x + 11, y + 11]);
}
// an off-screen place: a plate pinned to the map's edge on its bearing
function edgePlate(ctx, v, pl, txt, W, mapH){
  const [x, y] = toS(v, pl.x, pl.z), cx = W / 2, cy = mapH / 2, dx = x - cx, dy = y - cy;
  const s = Math.min((W / 2 - 24) / Math.abs(dx || 1), (mapH / 2 - 84) / Math.abs(dy || 1));
  const ex = cx + dx * s, ey = cy + dy * s;
  plateAt(ctx, txt, [(w) => [Math.min(ex, W - 8 - w), ey], (w) => [ex - w, ey + 24]]);
}
function mapGoalScreen(who, selId, sheetId){
  const ph = document.getElementById("phone"), H = ph.clientHeight, W = ph.clientWidth, p = P(who);
  const mine = GOALS.filter((g) => g.who === who && g.status === "open");
  const sel = mine.find((g) => g.id === selId);
  const panelH = Math.round(H * 0.5);
  const chips = PLAYERS.map((q) => `<button role="radio" aria-checked="${q.n === who}"><span class="disc${q.on ? "" : " off"}" style="background:${css(q.tok)};color:${q.on ? "var(--map-ink-on)" : css(q.tok)}">${q.n[0]}</span>${q.n}</button>`).join("");
  const cards = mine.map((g) => `<div class="gcard${g === sel ? " sel" : ""}">${goalRow(g)}</div>`).join("") + (finRow(who, false) ? `<div class="card" style="margin:0">${finRow(who, false)}</div>` : "") + (mine.length ? "" : `<div class="card" style="margin:0">${emptyCard()}</div>`);
  ph.innerHTML = `<div class="map"><canvas id="cv"></canvas>
    <div class="top"><button class="fab" aria-label="Back">${I.back}</button><div class="seg dims" role="radiogroup" aria-label="Dimension"><button role="radio" aria-checked="true">Overworld</button><button role="radio" aria-checked="false">Nether</button><button role="radio" aria-checked="false">End</button></div></div>
    <div class="scale" style="bottom:${panelH + 10}px"><i></i><span></span></div></div>
    <div class="panel" style="height:${panelH}px"><div class="grip"></div><div class="head"><button class="world" aria-label="World: Castle Hill — change">Castle Hill ${I.down}</button>
      <div class="seg tabs" role="tablist" aria-label="Panel"><button role="tab" aria-selected="false" aria-label="Layers">${I.layers}<span class="tl">Layers</span></button><button role="tab" aria-selected="false" aria-label="Timeline">${I.clock}<span class="tl">Timeline</span></button><button role="tab" aria-selected="true" aria-label="Goals">${I.target}<span class="tl">Goals</span></button></div></div>
      <div class="stat"><span class="dot"></span><span><b>Live · 2 on</b>Up to a minute behind the world · positions live</span></div>
      <div class="pbody"><div class="who" role="radiogroup" aria-label="Whose goals" data-hscroll>${chips}</div>${cards}</div></div>
    ${sheetId ? sheet(GOALS.find((g) => g.id === sheetId)) : ""}`;
  const cv = document.getElementById("cv"), dpr = devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d"), mapH = H - panelH;
  const near = (PLACES[who] || []).filter((x) => !x.far);
  const pts = near.concat([p]);
  const cx = pts.reduce((s, q) => s + q.x, 0) / pts.length, cz = pts.reduce((s, q) => s + q.z, 0) / pts.length;
  const v = {k:Math.min(2, (mapH - 150) / 120, (W - 60) / 120), cx, cz, mx:W / 2, my:70 + (mapH - 70 - 44) / 2};
  ph.querySelector(".scale span").textContent = `${Math.round(40 / v.k)} blocks · N↑`;
  CHROME = [[0, 0, W, 70], [0, mapH - 44, 170, mapH], [0, mapH, W, H]];
  BOXES = [];
  drawTerrain(ctx, W, H, v, dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  T = {halo:css("--map-halo"), ink:css("--map-ink"), inkOn:css("--map-ink-on"), plate:css("--map-plate"), text:css("--text")};
  const col = css(p.tok);
  const counted = sel && sel.count && !sel.world;
  if (counted) for (const pl of near) reach(ctx, v, pl, col);
  for (const pl of PLACES[who] || []) if (!pl.far) { const [x, y] = toS(v, pl.x, pl.z); placePin(ctx, x, y, col); }
  const [px, py] = toS(v, p.x, p.z); disc(ctx, px, py, p);
  if (counted) {
    for (const [name, n] of sel.count.chests) {
      const pl = PLACES[who].find((x) => x.name === name);
      if (pl.far) { edgePlate(ctx, v, pl, `${name} · ${n} · ${pl.far} blocks ${pl.dir}`, W, mapH); continue; }
      const [x, y] = toS(v, pl.x, pl.z); plateAt(ctx, `${name} · ${n} in chests`, [(w) => [x + 16, y], (w) => [x - 16 - w, y], (w) => [x - w / 2, y + 24]]);
    }
    const lbl = sel.count.carried === null ? `${p.n} · offline, carried not counted` : `${p.n} · ${sel.count.carried} carried`;
    plateAt(ctx, lbl, [(w) => [px - w / 2, py + 24], (w) => [px + 16, py], (w) => [px - 16 - w, py], (w) => [px - w / 2, py - 24]]);
  } else plateAt(ctx, p.n, [(w) => [px - w / 2, py + 24], (w) => [px + 16, py]]);
}

/* ---- states ---- */
let S = {};
const DEF = {view:"list", theme:""};
function readHash(){
  S = {...DEF};
  for (const kv of location.hash.slice(1).split("&")) { const [k,v] = kv.split("="); if (k && v !== undefined) S[k] = decodeURIComponent(v); }
  if (S.shot) document.body.classList.add("shot");
  const sys = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.dataset.theme = S.theme || sys;
}
function render(){
  readHash();
  document.getElementById("cap").innerHTML = CAPTION[V] + ` Reviewer chrome (the dashed strip) is not design. States open by hash, e.g. <span style="font-family:var(--font-mono)">#view=detail&amp;theme=light</span>.`;
  const ph = document.getElementById("phone"), view = S.view;
  let scrollTo = null;
  if (V === "a") {
    const empty = view === "empty";
    ph.innerHTML = screen(playersTable(false) + goalsSection(view === "finished", empty) + DAVE) + (view === "detail" ? sheet(GOALS[0]) : "");
    scrollTo = view === "offline" ? "last" : "goals";
  } else if (V === "b") {
    const empty = view === "empty";
    const saved = GOALS.splice(0); if (!empty) GOALS.push(...saved);
    const sh = view === "sheet" ? playerSheet("BlockyFox", 0, false) : view === "detail" ? playerSheet("BlockyFox", 1, false) : view === "finished" ? playerSheet("BlockyFox", 0, true) : view === "offline" ? playerSheet("Mira_P", 0, false) : view === "empty" ? playerSheet("BlockyFox", 0, false) : "";
    ph.innerHTML = screen(`<h3 class="sect">Online now<span class="r">2 playing</span></h3><div class="card pad"><div class="note" style="padding:10px 0">BlockyFox · 42 min &nbsp;·&nbsp; Tink42 · 12 min</div></div>` + playersTable(!empty) + DAVE) + sh;
    if (empty) GOALS.push(...saved);
  } else {
    if (view === "empty") { const saved = GOALS.splice(0); mapGoalScreen("BlockyFox", 0, 0); GOALS.push(...saved); }
    else mapGoalScreen(view === "offline" ? "Mira_P" : "BlockyFox", view === "offline" ? 6 : 1, view === "detail" ? 1 : 0);
    if (view === "finished") { mapGoalScreen("BlockyFox", 1, 0); const f = ph.querySelector(".fin"); f.outerHTML = finRow("BlockyFox", true); ph.querySelector(".pbody").scrollTop = 9999; }
  }
  const sc = document.getElementById("scroll");
  if (sc && scrollTo === "goals") sc.scrollTop = document.getElementById("goals").offsetTop - 70;
  if (sc && scrollTo === "last") sc.scrollTop = 9999;
  const views = V === "b"
    ? [["list","Players table"],["sheet","BlockyFox's sheet"],["detail","A goal opened"],["finished","Finished shown"],["offline","Mira_P (offline)"],["empty","No goals"]]
    : [["list", V === "c" ? "Goals tab" : "Goals section"],["detail","A goal's sheet"],["finished","Finished shown"],["offline","Mira_P (offline)"],["empty","No goals"]];
  const opt = (k, vals) => `<div class="srow"><span class="sl">${k}</span>${vals.map(([v, l]) => `<button aria-pressed="${S[k] === v}" data-k="${k}" data-v="${v}">${l}</button>`).join("")}</div>`;
  document.getElementById("sim").innerHTML = `<div class="stitle">Mock controls</div>` + opt("view", views) + opt("theme", [["","System"],["dark","Dark"],["light","Light"]]);
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  const o = {...S, [b.dataset.k]: b.dataset.v}; delete o.shot;
  location.hash = Object.entries(o).filter(([k, v]) => v !== DEF[k]).map(([k, v]) => `${k}=${v}`).join("&");
});
addEventListener("hashchange", render);
addEventListener("resize", render);
render();
</script>
