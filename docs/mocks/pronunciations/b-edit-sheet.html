<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pronunciations · B — Edit sheet</title>
    <style>
      :root {
        --bg: #0e0f11; --surface: #17181b; --surface-2: #1e2024; --border: #26282c;
        --text: #e6e7e9; --text-2: #9a9da3; --text-3: #5c5f66;
        --steel: #7fa7c9; --green: #8fbc9a; --amber: #c9a36a; --rose: #cf8a8f;
        --accent: var(--steel);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: #000; color: var(--text); display: flex; justify-content: center; padding: 20px; }
      .phone { position: relative; width: 400px; max-width: 100%; height: 780px; background: var(--bg); border: 1px solid var(--border); border-radius: 28px; overflow: hidden; }
      header { padding: 18px 20px 6px; }
      .crumb { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
      h1 { font-size: 22px; margin: 4px 0 0; }
      .body { padding: 12px 16px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-top: 14px; }
      .setting { display: flex; align-items: center; gap: 12px; padding: 15px 16px; cursor: pointer; }
      .setting:hover { background: var(--surface-2); }
      .setting + .setting { border-top: 1px solid var(--border); }
      .setting .txt { flex: 1; }
      .setting .txt .t { font-size: 15px; font-weight: 500; }
      .setting .txt .d { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
      .count { font-size: 13px; color: var(--text-2); }
      .chev { color: var(--text-3); font-size: 18px; }
      .seg { display: flex; background: var(--surface-2); border-radius: 999px; padding: 3px; margin: 12px 16px 2px; }
      .seg button { flex: 1; border: none; background: none; color: var(--text-2); font-size: 13px; font-weight: 600; padding: 7px; border-radius: 999px; cursor: pointer; }
      .seg button.active { background: rgba(127,167,201,0.16); color: var(--text); }

      .scrim { position: absolute; inset: 0; background: rgba(14,15,17,0.6); opacity: 0; pointer-events: none; transition: opacity .2s; }
      .scrim.open { opacity: 1; pointer-events: auto; }
      .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; background: var(--surface); border-top-left-radius: 22px; border-top-right-radius: 22px; border-top: 1px solid var(--border); transform: translateY(100%); transition: transform .24s ease; display: flex; flex-direction: column; }
      .sheet.open { transform: translateY(0); }
      .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 10px auto 4px; }
      .sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 6px 18px 12px; }
      .sheet-h .t { font-size: 18px; font-weight: 600; }
      .sheet-h .x { background: none; border: none; color: var(--text-2); font-size: 20px; cursor: pointer; }
      .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; margin: 0 18px 8px; }
      .chip.ok { color: var(--green); background: rgba(143,188,154,0.13); }
      .chip.warn { color: var(--amber); background: rgba(201,163,106,0.13); }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .list { overflow-y: auto; padding: 0 0 6px; }
      .row { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-top: 1px solid var(--border); }
      .row .word { font-size: 15px; font-weight: 500; }
      .row .arrow { color: var(--text-3); }
      .row .say { color: var(--text-2); font-size: 14px; flex: 1; }
      .icon-btn { background: none; border: none; color: var(--text-2); padding: 8px; border-radius: 10px; cursor: pointer; font-size: 15px; }
      .icon-btn:hover { background: var(--surface-2); color: var(--text); }
      .adder { padding: 12px 18px 4px; display: flex; flex-direction: column; gap: 10px; }
      .two { display: flex; gap: 10px; }
      .field { display: flex; flex-direction: column; gap: 4px; flex: 1; }
      .field label { font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3); }
      input { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 16px; padding: 11px 12px; width: 100%; }
      input:focus-visible { outline: 2px solid var(--accent); }
      .foot { display: flex; gap: 10px; padding: 12px 18px 22px; border-top: 1px solid var(--border); }
      .btn { border-radius: 12px; padding: 11px 14px; font-size: 14px; font-weight: 600; border: 1px solid transparent; cursor: pointer; }
      .btn.primary { background: var(--steel); color: #0e0f11; flex: 1; }
      .btn.test { background: none; color: var(--steel); border-color: rgba(127,167,201,0.4); }
    </style>
  </head>
  <body>
    <div class="phone">
      <header>
        <div class="crumb">Settings › Read aloud</div>
        <h1>Read aloud</h1>
      </header>
      <div class="body">
        <div class="seg"><button>Kokoro</button><button class="active">Voice</button><button>Native</button></div>
        <div class="card">
          <div class="setting"><div class="txt"><div class="t">Answer voice</div><div class="d">af heart · warm female</div></div><span class="chev">›</span></div>
          <div class="setting" id="open">
            <div class="txt"><div class="t">Pronunciations</div><div class="d">Teach it how to say tricky words</div></div>
            <span class="count" id="count">3 words</span><span class="chev">›</span>
          </div>
        </div>
      </div>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet">
        <div class="grab"></div>
        <div class="sheet-h"><span class="t">Pronunciations</span><button class="x" id="close">✕</button></div>
        <div class="chip ok" id="health"><span class="dot"></span> Voice engine: misaki ✓</div>
        <div class="list" id="list"></div>
        <div class="adder">
          <div class="two">
            <div class="field"><label>Word</label><input id="w" placeholder="Titusville" /></div>
            <div class="field"><label>Say it like</label><input id="s" placeholder="Tight us ville" /></div>
          </div>
        </div>
        <div class="foot">
          <button class="btn test" id="test">▷ Test</button>
          <button class="btn primary" id="add">Add pronunciation</button>
        </div>
      </div>
    </div>
    <script>
      let lex = { Titusville: "Tight us ville", GIF: "jiff", Nginx: "engine ex" };
      const list = document.getElementById("list"), count = document.getElementById("count");
      function render() {
        list.innerHTML = ""; count.textContent = Object.keys(lex).length + " words";
        for (const wd of Object.keys(lex)) {
          const r = document.createElement("div"); r.className = "row";
          r.innerHTML = '<span class="word">' + wd + '</span><span class="arrow">→</span><span class="say">' + lex[wd] +
            '</span><button class="icon-btn p">▷</button><button class="icon-btn d">✕</button>';
          r.querySelector(".p").onclick = (e) => { const b = e.currentTarget; b.textContent = "❚❚"; setTimeout(() => (b.textContent = "▷"), 800); };
          r.querySelector(".d").onclick = () => { delete lex[wd]; render(); };
          list.appendChild(r);
        }
      }
      const scrim = document.getElementById("scrim"), sheet = document.getElementById("sheet");
      const openSheet = () => { scrim.classList.add("open"); sheet.classList.add("open"); };
      const closeSheet = () => { scrim.classList.remove("open"); sheet.classList.remove("open"); };
      document.getElementById("open").onclick = openSheet;
      document.getElementById("close").onclick = closeSheet;
      scrim.onclick = closeSheet;
      document.getElementById("add").onclick = () => {
        const wv = w.value.trim(), sv = s.value.trim();
        if (wv && sv) { lex[wv] = sv; w.value = s.value = ""; render(); }
      };
      document.getElementById("test").onclick = (e) => { const b = e.currentTarget; b.textContent = "❚❚ Playing"; setTimeout(() => (b.textContent = "▷ Test"), 900); };
      const health = document.getElementById("health"); let ok = true;
      health.onclick = () => { ok = !ok; health.className = "chip " + (ok ? "ok" : "warn");
        health.innerHTML = '<span class="dot"></span> ' + (ok ? "Voice engine: misaki ✓" : "Voice engine: espeak — pronunciations still apply, quality limited"); };
      render();
    </script>
  </body>
</html>
