<div class="card">
  <h2>Every panel</h2>
  <label class="row"><span>Speaker volume <strong>70</strong></span><input type="range" min="0" max="100" value="70"></label>
  <label class="row"><span>Microphone gain <strong>30 dB</strong></span><input type="range" min="0" max="42" value="30"></label>
  <label class="row"><span>Screen brightness <strong>255</strong></span><input type="range" min="0" max="255" value="255"></label>
  <label class="row"><span>Dimmed to <strong>10%</strong> <em style="font-style:normal;color:var(--text-3)">(25 of 255)</em></span><input type="range" min="0" max="100" value="10"></label>
  <label class="chk"><input type="checkbox" checked><span>Automatic microphone gain<em>Lets the panel turn its own microphone up for a quiet voice and down for a loud one.</em></span></label>
</div>
