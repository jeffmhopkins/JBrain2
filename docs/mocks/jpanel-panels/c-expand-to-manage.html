<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>jpanel Panels — C — expand to manage</title>
<style>
/* Tokens lifted verbatim from frontend/src/styles/tokens.css — a mock that invents values
   cannot tell you whether the real screen will look like this. */
:root{
  --bg:#0e0f11;--surface:#17181b;--surface-2:#1e2024;--border:#26282c;
  --text:#e6e7e9;--text-2:#9a9da3;--text-3:#5c5f66;
  --steel:#7fa7c9;--steel-tint:rgba(127,167,201,.13);
  --green:#8fbc9a;--green-tint:rgba(143,188,154,.13);
  --amber:#c9a36a;--amber-tint:rgba(201,163,106,.13);
  --rose:#cf8a8f;--rose-tint:rgba(207,138,143,.13);
  --accent:var(--steel);--accent-tint:var(--steel-tint);
  --ok:var(--green);--warn:var(--amber);--danger:var(--rose);--danger-tint:var(--rose-tint);
  --font-scale:.75;
  --fs-micro:calc(12px*var(--font-scale));--fs-secondary:calc(14px*var(--font-scale));
  --fs-note:calc(15px*var(--font-scale));--fs-body:calc(16px*var(--font-scale));
  --fs-title:calc(18px*var(--font-scale));
  --r-input:12px;--r-seg:14px;--r-card:16px;--r-pill:999px;
  --shadow:rgba(0,0,0,.45);--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#05070a;color:var(--text);padding:24px;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:grid;place-items:center;min-height:100vh}
.phone{width:390px;height:820px;background:var(--bg);border-radius:30px;overflow:hidden;
  position:relative;box-shadow:0 20px 60px var(--shadow);display:flex;flex-direction:column}
.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:12px;padding:0 12px;
  border-bottom:1px solid var(--border);background:var(--surface)}
.topbar .back{border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  border-radius:var(--r-input);padding:8px 14px;font-size:var(--fs-secondary)}
.topbar .ttl{font-weight:600;font-size:var(--fs-title)}
.seg{display:flex;gap:4px;margin:12px 16px 0;background:var(--surface-2);
  border-radius:var(--r-seg);padding:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--text-2);
  font-size:var(--fs-note);font-weight:600;padding:10px 0;border-radius:10px}
.seg button.on{background:var(--accent-tint);color:var(--text)}
/* THE GUTTER THE REAL SCREEN IS MISSING: 16px, max 640, matching .jp-threads and .ep-body. */
.body{padding:16px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;flex:1}
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-card);padding:16px}
h2{margin:0 0 12px;font-size:var(--fs-title);font-weight:500}
.hint{margin:6px 0 0;font-size:var(--fs-micro);color:var(--text-3)}
.meta{margin:4px 0 0;font-size:var(--fs-micro);color:var(--text-2)}
.mono{font-family:var(--font-mono)}
.pill{font-size:var(--fs-micro);color:var(--text-2);background:var(--steel-tint);
  border-radius:var(--r-pill);padding:2px 8px}
/* 44px floor on the hit area — bare px, never scaled by --font-scale. */
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts button{min-height:44px;padding:0 14px;font-size:var(--fs-secondary);
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-input);color:var(--text)}
.acts .danger{background:var(--danger-tint);border-color:transparent;color:var(--danger)}
.acts .primary{background:var(--accent-tint);border-color:transparent;color:var(--accent)}
label.row{display:block;margin:0 0 14px;font-size:var(--fs-secondary);color:var(--text-2)}
label.row span{display:block;margin:0 0 6px}
label.row strong{color:var(--text)}
input[type=range]{width:100%;height:28px;accent-color:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-body)}
.chk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.chk em{display:block;font-style:normal;font-size:var(--fs-micro);color:var(--text-3);margin-top:3px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--danger)}.dim{color:var(--text-3)}


/* Collapsed the list is a roster you can scan; open one and it becomes the thing you manage.
   The actions stay VISIBLE once open — not behind a gesture. This tab exists because revoke
   was behind a swipe rail on the Location screen and the owner could not find it. */
.head{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;
  color:var(--text);text-align:left;min-height:44px}
.head .nm{font-size:var(--fs-title);font-weight:600;flex:1}
.chev{color:var(--text-3);font-size:var(--fs-body)}
.drawer{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.field{display:block;margin:0 0 10px;font-size:var(--fs-secondary);color:var(--text-2)}
.field input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-input);padding:11px 12px;color:var(--text);
  font:inherit;font-size:max(16px,var(--fs-body));margin-top:6px}

</style>
</head>
<body>
<div class="phone">
  <div class="topbar"><button class="back">Back</button><span class="ttl">jpanel</span></div>
  <div class="seg"><button>Messages</button><button class="on">Panels</button><button>Flash</button></div>
  <div class="body">
<div class="card">
  <h2>Every panel</h2>
  <label class="row"><span>Speaker volume <strong>70</strong></span><input type="range" min="0" max="100" value="70"></label>
  <label class="row"><span>Microphone gain <strong>30 dB</strong></span><input type="range" min="0" max="42" value="30"></label>
  <label class="row"><span>Screen brightness <strong>255</strong></span><input type="range" min="0" max="255" value="255"></label>
  <label class="row"><span>Dimmed to <strong>10%</strong> <em style="font-style:normal;color:var(--text-3)">(25 of 255)</em></span><input type="range" min="0" max="100" value="10"></label>
  <label class="chk"><input type="checkbox" checked><span>Automatic microphone gain<em>Lets the panel turn its own microphone up for a quiet voice and down for a loud one.</em></span></label>
</div>

  <section class="card" aria-label="Elora">
    <button class="head"><span class="nm">Elora</span><span class="ok" style="font-size:var(--fs-micro)">12 min ago</span><span class="chev">&#8250;</span></button>
    <p class="meta"><span class="mono">0.3.04</span> &middot; awake</p>
  </section>

  <section class="card" aria-label="Lydian">
    <button class="head"><span class="nm">Lydian</span><span class="bad" style="font-size:var(--fs-micro)">10 hours ago</span><span class="chev" style="transform:rotate(90deg);display:inline-block">&#8250;</span></button>
    <p class="meta"><span class="bad">Not reporting.</span> <span class="mono">0.3.04</span></p>
    <div class="drawer">
      <label class="field">Pet&rsquo;s name<input type="text" value="fish"></label>
      <p class="hint">This is what they <strong>say</strong> to it &mdash; the panel listens for &ldquo;hey fish&rdquo;.</p>
      <div class="acts">
        <button class="primary">Save</button><button>Rename panel</button><button class="danger">Revoke</button>
      </div>
    </div>
  </section>

  <section class="card" aria-label="Jeff">
    <button class="head"><span class="nm">Jeff</span><span class="pill">display</span><span class="ok" style="font-size:var(--fs-micro)">3 min ago</span><span class="chev">&#8250;</span></button>
    <p class="meta"><span class="mono">0.3.04</span> &middot; awake</p>
  </section>

  </div>
</div>
</body>
</html>
