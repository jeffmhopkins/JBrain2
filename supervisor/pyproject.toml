[project]
name = "jbrain-supervisor"
version = "0.1.0"
description = "Socket-holding supervisor: fixed command set over the compose stack."
requires-python = ">=3.11"
dependencies = [
    "docker>=7",
    "fastapi>=0.115",
    "pydantic-settings>=2",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    # The sidecar's numpy, in the DEV extra because the supervisor suite loads
    # deploy/sdr/*.py by path (CLAUDE.md #8: a sidecar dependency IS a dev-env
    # dependency). Pinned to the SERIES Debian trixie ships as python3-numpy
    # (1:2.2.4+ds-1), not just the major: `~=2.2` floats to 2.4/2.5, and CI
    # proving an API the image cannot have is the failure this pin exists to
    # stop. Bump it when the image's Debian does.
    "numpy~=2.2.4",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supervisor"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

# How to read the sdr sidecar's tree, which `include` deliberately does not list yet
# (deploy/sdr has one pre-existing override error, and iq.py/radio.py are still landing).
# It applies wherever pyright meets those files — an editor now, CI the day the include
# arrives — because three facts about them are invisible from here. They import each other
# by BARE NAME off one image WORKDIR, hence `extraPaths`. And `SoapySDR` is an apt package
# present in the image and in no venv, so reportMissingImports would flag an import that
# is correct; deferring it into a function body does not help, pyright resolves those too.
# What proves a sidecar import really resolves is `Dockerfile.sdr`'s build-time
# `import server, SoapySDR, numpy`, which CI now runs on every PR that touches it.
[[tool.pyright.executionEnvironments]]
root = "../deploy/sdr"
extraPaths = ["../deploy/sdr"]
reportMissingImports = "none"
# The sidecar runs on Debian trixie's CPython, not the supervisor's 3.11 floor — the
# rebase to `debian:trixie-slim` is what put an interpreter version in two places.
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
