dependencies:
  idf: ">=5.5,<6.1"
  # The AMOLED driver. Espressif's own component, and the one the VENDOR's example uses for
  # BOTH board revisions — V1's SH8601 and V2's CO5300 take the same command set here.
  espressif/esp_lcd_co5300:
    version: "^2.1.0"
    public: true
  # The ES8311 codec, via Espressif's device layer — the same pairing the vendor's own
  # 12_i2s_codec example uses, reached directly rather than through their BSP (which would
  # also want to own the display and touch this firmware already drives).
  espressif/esp_codec_dev:
    version: "^1.3.1"
    public: true
  # THE SPEECH MODELS, SHIPPED BEFORE THE CODE THAT USES THEM. The app does not call esp-sr
  # yet and the linker drops it, so this costs nothing in the image — what it produces is
  # `srmodels.bin`, which goes in `dist/` and is written to the `model` partition by the one
  # USB flash each panel gets. That partition is the only thing OTA cannot reach
  # (`esp_https_ota` writes app slots), so the models have to be on the board before the
  # feature exists rather than after. See ROOM_ENDPOINT_PLAN.md and firmware/README.md.
  espressif/esp-sr:
    version: "^2.5.4"
