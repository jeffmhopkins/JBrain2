<!DOCTYPE html><html><head><meta charset=utf-8><script src="/growbot-box.js?v=4d95846eed71"></script>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Camera test · GrowBot</title><style>
:root{color-scheme:dark;--bg:#05070d;--panel:#0e1622;--line:rgba(120,160,200,.25);--text:#e8f6ff;--mut:#7f93ab;--teal:#37e0c8;--red:#ff6b81;--amber:#ffb347}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
#camtest{display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box;min-height:100vh}
#title{font-size:clamp(26px,8vw,56px);font-weight:700;line-height:1.1;margin:0}
#sub{font-size:clamp(16px,4.5vw,28px);color:var(--mut);margin:0}
#count{font-size:clamp(30px,10vw,72px);font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}
.stage{position:relative;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:45vh}
#vid,#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px/1 ui-monospace,monospace;padding:6px 8px;border:1px solid var(--line);border-radius:999px;color:var(--mut)}
.chip.hit{color:#000;background:var(--c);border-color:var(--c)}
button{font-size:16px;padding:14px;background:#101826;color:#dfe8f3;border:1px solid #2a3a4d;border-radius:10px;font-weight:600;min-height:44px}
#startBtn{font-size:22px;padding:22px;border-color:var(--teal)}
#live{display:none;gap:8px}#live>button{flex:1}
details{font-size:13px;color:var(--mut)}details label{display:flex;gap:8px;align-items:center;margin:6px 0}
select,input[type=number]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px}
input[type=number]{width:60px}
table{border-collapse:collapse;font-size:12px;width:100%}td,th{border-bottom:1px solid var(--line);padding:4px;text-align:left}
.v{padding:8px;border-radius:8px;margin:4px 0;font-size:14px;background:var(--panel)}.v.ok b{color:var(--teal)}.v.warn b{color:var(--amber)}.v.fail b{color:var(--red)}
.mut,#saved{color:var(--mut);font-size:12px}
</style></head><body>
<main id=camtest>
  <p id=title>Camera test</p>
  <p id=sub>Can this phone see you far enough, fast enough, to follow you? Prop it up on its own where the robot's camera would be, screen toward the room. It talks you through each station; keep the sound on.</p>
  <div id=count></div>
  <button id=startBtn>Start the camera test</button>
  <div class=stage><video id=vid playsinline muted autoplay></video><canvas id=ov></canvas></div>
  <div id=chips></div>
  <div id=live><button id=skipBtn>Skip ahead</button><button id=stopBtn>Stop</button></div>
  <div id=saved></div>
  <button id=dl style="display:none">Download the log</button>
  <div id=results></div>
  <details><summary>Settings</summary>
    <label>Camera <select id=lens><option value=user selected>Front (the robot's)</option><option value=environment>Back</option></select></label>
    <label>Resolution <select id=res><option value=640>640×480</option><option value=960 selected>960×720</option><option value=1280>1280×960</option></select></label>
    <label>Field of view: short side <input id=fovN type=number value=60>° long side <input id=fovW type=number value=75>°</label>
    <label><input type=checkbox id=on_now checked> now: the creature's detector today (short-range, 320 px)</label>
    <label><input type=checkbox id=on_full checked> full: full-range on the whole frame</label>
    <label><input type=checkbox id=on_zoom checked> zoom: full-range on a crop around your face (proposed)</label>
    <label><input type=checkbox id=on_body checked> body: pose, for when your face is out of frame</label>
  </details>
</main>
<script type="module" src="/growbot-camtest.js?v=3c9e5bdb0e14"></script>
</body></html>
